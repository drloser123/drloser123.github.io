n : lorsqu’on demande à la victime de répéter une phrase, elle a des difficultés à parler ou à comprendre.\nCes trois signes doivent être systématiquement recherchés. Ils sont communément appelés FAST."},{"c":"05PR10","h":"Détresse neurologique","x":"appliquer la conduite à tenir adaptée et réaliser en priorité les gestes d’urgence qui s’imposent ;\nLa victime est consciente1\nallonger la victime ;\nadministrer de l’oxygène en inhalation si nécessaire ;\nprotéger la victime contre le froid, la chaleur ou les intempéries.\npoursuivre le bilan et surveiller attentivement :\nson état neurologique."},{"c":"04FT14","h":"Mesure de la température","x":"hypothermique.\nIl est spécifiquement conçu pour mesurer des températures corporelles très basses, en dessous de la normale (36,5–37,5 °C)."},{"c":"06AC06","h":"Malaise hypoglycémique chez le diabétique","x":"Lors du transfert de la valeur de la mesure, il est essentiel d’indiquer l’unité de mesure de la glycémie utilisée par l’appareil : millimoles par litre (mmol/l), milligrammes par décilitre (mg/dl) ou grammes par litre (g/l). En fonction de l’unité, le chiffre est totalement différent.\nOn considère qu’une victime est en hypoglycémie si la valeur mesurée de la glycémie est < 3,3 mmol/l (ou < 60 mg/dl ou < 0,6 g/l)."},null,null,{"c":"07AC01","h":"Brûlures","x":"L’étendue de la brûlure doit être évaluée, car la surface atteinte conditionne également la conduite à tenir.\nPour évaluer cette étendue, le secouriste peut s’aider de différentes règles dont la plus connue, chez l’adulte, est la règle de Wallace.\nChez l’enfant et pour des petites surfaces, il peut s’aider de la surface de la main (paume et doigts) de la victime qui est égale à 1 % de la surface totale de la peau de la victime, quel que soit l’âge."},{"c":"07AC01","h":"Brûlures","x":"L’étendue de la brûlure doit être évaluée, car la surface atteinte conditionne également la conduite à tenir.\nPour évaluer cette étendue, le secouriste peut s’aider de différentes règles dont la plus connue, chez l’adulte, est la règle de Wallace.\nChez l’enfant et pour des petites surfaces, il peut s’aider de la surface de la main (paume et doigts) de la victime qui est égale à 1 % de la surface totale de la peau de la victime, quel que soit l’âge."},{"c":"07AC01","h":"Brûlures","x":"L’étendue de la brûlure doit être évaluée, car la surface atteinte conditionne également la conduite à tenir.\nPour évaluer cette étendue, le secouriste peut s’aider de différentes règles dont la plus connue, chez l’adulte, est la règle de Wallace.\nChez l’enfant et pour des petites surfaces, il peut s’aider de la surface de la main (paume et doigts) de la victime qui est égale à 1 % de la surface totale de la peau de la victime, quel que soit l’âge."},{"c":"07AC01","h":"Brûlures","x":"L’étendue de la brûlure doit être évaluée, car la surface atteinte conditionne également la conduite à tenir.\nPour évaluer cette étendue, le secouriste peut s’aider de différentes règles dont la plus connue, chez l’adulte, est la règle de Wallace.\nChez l’enfant et pour des petites surfaces, il peut s’aider de la surface de la main (paume et doigts) de la victime qui est égale à 1 % de la surface totale de la peau de la victime, quel que soit l’âge."},null,null,null,null,null,null,{"c":"07PR02","h":"Plaie","x":"allongée, yeux fermés6 en demandant de ne pas bouger la tête en présence d'une plaie à l'œil ;"},{"c":"07PR02","h":"Plaie","x":"En présence d’une plaie simple\nse laver les mains avec de l’eau et du savon ou utiliser une solution hydroalcoolique ;\nse protéger par le port de gants ;\nnettoyer la plaie :\navec de l’eau courante (propre) ou en bouteille, à défaut avec du sérum physiologique ;\nutiliser du savon si la plaie est souillée ;\ns’aider si besoin d’une compresse pour enlever les souillures.\nsécher la zone autour de la plaie et la protéger par un pansement ;"},{"c":"07PR02","h":"Plaie","x":"conseiller à la victime de consulter un médecin si :\nelle n’est pas à jour de sa vaccination antitétanique ;\nla plaie devient chaude, rouge, si elle suinte, si elle gonfle ou si elle continue de faire mal dans les vingt-quatre heures."},{"c":"07FT12","h":"Pose d’un collier cervical","x":"Le collier cervical ne doit pas être utilisé s’il existe :\nune possible obstruction des voies aériennes ;\nune impossibilité de mettre la tête en position neutre (déformation préexistante du rachis cervical)."},{"c":"05AC03","h":"Hémorragies extériorisées","x":"Dans les autres cas, il s’agit d’une perte de sang inhabituelle, émanant des voies :\nurinaires : émission de sang ou d’urine teintée de sang ;\nanale : sang dans les selles ou saignement isolé ;\nvaginale : règles anormalement abondantes ou saignement inattendu."},null,null,{"c":"08PR04","h":"Accouchement inopiné","x":"la perte des eaux : heure de la perte et couleur du liquide (transparent, trouble, sanglant) ;"},{"c":"04FT10","h":"Mesure de la pression artérielle","x":"Les valeurs normales de pression artérielle chez l’adulte au repos et réveillé oscillent autour de 100 mmHg de PA systolique et 80 mmHg de PA diastolique."},null,{"c":"08AC04","h":"Accouchement inopiné","x":"On appelle parturiente une femme enceinte lorsque le travail a commencé."},{"c":"08AC04","h":"Accouchement inopiné","x":"L’accouchement se déroule en trois étapes :\nL’expulsion\nLa délivrance"},{"c":"08AC04","h":"Accouchement inopiné","x":"La délivrance\nIl s’agit de la sortie hors de l’utérus du placenta et du reste du cordon ombilical. Généralement, elle survient vingt à trente minutes après la sortie du nouveau-né."},{"c":"08PR04","h":"Accouchement inopiné","x":"L’accouchement n’a pas encore eu lieu\ninstaller la femme enceinte sur le côté1 ;\n1 De préférence sur le côté gauche. L’installation sur le dos est à proscrire."},{"c":"08PR04","h":"Accouchement inopiné","x":"demander à la parturiente de pousser :\nà partir du moment où le haut du crâne du nouveau-né commence à apparaître à la vulve ;\nlorsqu’elle ressent un besoin irrépressible de pousser.\nlui demander de pousser vers le bas en retenant sa respiration dès qu’elle ressent la contraction et, si possible, jusqu’au maximum de la contraction ;"},{"c":"08PR04","h":"Accouchement inopiné","x":"lâcher la tête du nouveau-né pour ne pas s’opposer à sa rotation1,\nune fois la tête totalement sortie, si la tête ne tourne pas, demander à la parturiente d’arrêter de pousser et vérifier s’il y a un circulaire du cordon autour du cou du nouveau-né,\nen présence d’un circulaire du cordon, procéder à son dégagement,"},{"c":"08PR04","h":"Accouchement inopiné","x":"noter l’heure de naissance ;"},{"c":"08PR04","h":"Accouchement inopiné","x":"La délivrance\nLa délivrance se fait chez une femme après l’accouchement et le plus souvent en présence d’une équipe médicale. Toutefois, en son absence, il faut réaliser les actions suivantes :\nlaisser sortir le placenta sans tirer dessus, ni sur le cordon ombilical et en faisant pousser ;\nrecueillir le placenta, dans une cuvette ou un sac plastique, une fois expulsé ;\nl’acheminer avec la mère à l’hôpital pour vérifier son intégrité ;"},{"c":"08PR04","h":"Accouchement inopiné","x":"Cas particulier : si le placenta ne sort pas au bout de 30 minutes après la naissance, réaliser un massage utérin pour prévenir une hémorragie."},{"c":"08FT02","h":"Massage utérin","x":"réaliser ce massage :\npendant 1 minute : toutes les 10 minutes en l’absence d’hémorragie ;\nen continu en cas d’hémorragie."},{"c":"08PR05","h":"Prise en charge du nouveau-né à la naissance","x":"poser le nouveau-né sur le ventre de sa mère et sur le côté, peau contre peau, la tête bien dégagée ;"},{"c":"08PR05","h":"Prise en charge du nouveau-né à la naissance","x":"examiner le nouveau-né en appréciant :\nson cri ou sa respiration,\nson tonus (mouvements spontanés des membres).\nNB : L’existence d’une pâleur doit alerter les secouristes et être indiquée lors de la transmission du bilan.\nLe nouveau-né est en bonne santé\nLe nouveau-né en bonne santé présente une respiration et un cri vigoureux ; un tonus vif."},{"c":"08PR05","h":"Prise en charge du nouveau-né à la naissance","x":"protéger le nouveau-né contre le froid. Pour cela :\nsécher par tamponnement la peau et la tête du bébé, à l’aide d’une serviette propre, sèche et tiède,\nprotéger le nouveau-né des courants d’air et du froid en l’enveloppant.\nEnvelopper la tête et le corps du nouveau-né, à l’exception de la face, dans des serviettes ou des vêtements secs et chauds ou le glisser dans un sac en polyéthylène.\nSi possible, couvrir sa tête à l’aide d’un bonnet."},{"c":"08FT01","h":"Soin au cordon ombilical","x":"Réalisation\nIl s’agit de clamper le cordon en deux points du cordon ombilical et de sectionner celui-ci entre les deux clamps :\nchanger les gants utilisés lors de l’accouchement et s’équiper de gants et de lunette (ou visière oculaire) de protection ;\nessuyer le cordon, avec une compresse, sur la zone prévue de positionnement des clamps ;\nposer le premier clamp à environ 10 à 15 cm de l’ombilic et le verrouiller ;\npincer le cordon avec une compresse stérile pour le vider de son sang, en partant du premier clamp sur environ 3 à 5 cm. Cela évitera les projections de sang au moment de la section du cordon ;\nplacer le second clamp sur le cordon toujours pincé et le verrouiller ;\ncouper le cordon entre les clamps ;\nrecouvrir le cordon et le clamp relié au nouveau-né d’une compresse stérile."},{"c":"08PR05","h":"Prise en charge du nouveau-né à la naissance","x":"Lors de son transport, le nouveau-né doit être placé dans un système fermé et fixé (incubateur, lit-auto)."}];
{
const KEY='trivialpse-v2';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const byTheme=THEMES.map(t=>Q.map((x,i)=>x.t===t.id?i:-1).filter(i=>i>=0));
let REVIEW=false,REV={i:0,dec:{}};try{REV=Object.assign(REV,JSON.parse(localStorage.getItem('trivialpse-rev')||'{}'))}catch(e){}
const saveRev=()=>{try{localStorage.setItem('trivialpse-rev',JSON.stringify(REV))}catch(e){}};
const removed=i=>REV.dec[Q[i].q]==='out';
let S=null,setup={names:['',''],goal:'6',pts:10,mode:'de',timer:false,again:true},tick=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({S,setup}))}catch(e){}};
try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){setup=Object.assign(setup,d.setup||{});S=d.S||null}}catch(e){}

function pie(w,cls=''){
  const r=48,c=50;let p='';
  for(let i=0;i<6;i++){
    const a0=(i*60-90)*Math.PI/180,a1=((i+1)*60-90)*Math.PI/180;
    const x0=c+r*Math.cos(a0),y0=c+r*Math.sin(a0),x1=c+r*Math.cos(a1),y1=c+r*Math.sin(a1);
    p+=`<path d="M${c},${c} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 0 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${w[i]?THEMES[i].col:'#24365f'}" stroke="#0d1a35" stroke-width="2.4"/>`;
  }
  return `<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="49.5" fill="#0d1a35"/>${p}<circle cx="50" cy="50" r="49" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="1.6"/><circle cx="50" cy="50" r="9" fill="#fff"/><circle cx="50" cy="50" r="4" fill="#0d1a35"/></svg>`;
}
const wedges=p=>p.w.filter(Boolean).length;
const goalTxt=()=>S.goal==='pts'?`${S.pts} bonnes réponses`:`${S.goal} camemberts`;
function won(p){return S.goal==='pts'?p.pts>=S.pts:wedges(p)>=+S.goal}

/* ---------- SETUP ---------- */
function vSetup(){
  const inProg=!!(S&&S.players&&S.screen!=='win');
  const rows=setup.names.map((n,i)=>`<div class="prow"><input type="text" id="pn${i}" value="${esc(n)}" placeholder="Joueur ${i+1}" maxlength="18" autocomplete="off">${setup.names.length>1?`<button class="x" data-del="${i}" aria-label="Retirer le joueur ${i+1}">×</button>`:''}</div>`).join('');
  const seg=(k,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button data-set="${k}" data-v="${v}" class="${String(setup[k])===v?'on':''}">${l}</button>`).join('')}</div>`;
  return `<div class="hero">${pie([1,1,1,1,1,1])}<div><h1>Trivial PSE</h1><div class="mut">Réviser le Mémo Urgence en jouant, sur un seul téléphone qu’on se passe.</div></div></div>
  ${inProg?`<button class="big" id="resume" style="margin-bottom:14px">Reprendre la partie en cours</button>`:''}
  <div class="panel"><label class="l">Joueurs ou équipes</label>${rows}
  ${setup.names.length<8?`<button class="ghost" id="add">+ Ajouter un joueur</button>`:''}</div>
  <div class="panel"><label class="l">Pour gagner</label>${seg('goal',[['6','Les 6 camemberts'],['3','3 camemberts'],['pts','Points']])}
  ${setup.goal==='pts'?`<div style="margin-top:10px">${seg('pts',[['5','5 pts'],['10','10 pts'],['15','15 pts']])}</div>`:''}
  <label class="l" style="margin-top:14px">Choix du thème</label>${seg('mode',[['de','Lancer le dé'],['choix','Au choix'],['mix','Dé + joker']])}
  <div class="tog" style="margin-top:10px"><span>Rejouer après une bonne réponse</span><button class="sw ${setup.again?'on':''}" data-tog="again" aria-label="Rejouer après une bonne réponse" aria-pressed="${setup.again}"></button></div>
  <div class="tog"><span>Chrono de 30 secondes</span><button class="sw ${setup.timer?'on':''}" data-tog="timer" aria-label="Chrono de 30 secondes" aria-pressed="${setup.timer}"></button></div></div>
  <div class="panel"><label class="l">Les 6 thèmes (${Q.length} questions)</label><div class="leg">${THEMES.map(t=>`<div><span class="dot" style="background:${t.col}"></span>${t.name} · ${byTheme[t.id].length}</div>`).join('')}</div></div>
  <button class="sec" id="review" style="margin-bottom:12px">Passer en revue les questions${revCount()}</button>
  <button class="big" id="start">${inProg?'Nouvelle partie':'C’est parti'}</button>
  <p class="foot">Bonne réponse sur un thème pas encore gagné = un camembert de cette couleur.<br>Questions tirées du Mémo Urgence v2.0 (Protection Civile Paris Seine, août 2023, recommandations PS 2022).</p>`;
}
function readNames(){setup.names=setup.names.map((n,i)=>{const el=$('#pn'+i);return el?el.value:n})}

/* ---------- TURN ---------- */
function chips(){return `<div class="bar">${S.players.map((p,i)=>`<div class="chip ${i===S.cur?'cur':''}">${pie(p.w)}${esc(p.name)} <b>${p.pts}</b></div>`).join('')}</div>`}
function topbar(){return `<div class="top"><button id="menu">‹ Menu</button><span class="mut">Objectif : ${goalTxt()}</span></div>`}
function vTurn(){
  const p=S.players[S.cur];
  const pickList=`<div class="pick">${THEMES.map(t=>`<button data-theme="${t.id}"><span class="dot" style="background:${t.col}"></span><span>${t.name}${p.w[t.id]?' ✓':''}<small>${t.sub}</small></span></button>`).join('')}</div>`;
  let act;
  if(S.mode==='choix'||S.joker) act=`<p class="mut" style="margin:0 0 10px">${S.joker?'Joker ! ':''}Choisis ton thème</p>${pickList}`;
  else act=`<button class="die" id="die" aria-label="Lancer le dé">Lance le dé</button>`;
  return `${topbar()}${chips()}<div class="stage"><div class="who">À toi de jouer</div><div class="name">${esc(p.name)}</div>${pie(p.w,'pie')}
  <div class="mut" style="margin:-4px 0 14px">${wedges(p)} camembert${wedges(p)>1?'s':''} · ${p.pts} point${p.pts>1?'s':''}</div>${act}</div>`;
}
function roll(){
  const die=$('#die');if(die.disabled)return;die.disabled=true;die.classList.add('roll');
  const faces=S.mode==='mix'?7:6,res=Math.floor(Math.random()*faces);let n=0;
  const iv=setInterval(()=>{const k=n%6;die.style.background=THEMES[k].col;die.textContent=THEMES[k].name;n++},90);
  setTimeout(()=>{clearInterval(iv);die.classList.remove('roll');
    if(res===6){die.style.background='#fff';die.style.color='#0d1a35';die.textContent='Joker : au choix !';setTimeout(()=>{S.joker=true;save();render()},800)}
    else{die.style.background=THEMES[res].col;die.textContent=THEMES[res].name;setTimeout(()=>ask(res),800)}
  },950);
}
function ask(t){
  const pool=byTheme[t].filter(i=>!removed(i));let used=S.used[t]||[];
  let free=pool.filter(i=>!used.includes(i));if(!free.length){used=[];free=pool.slice()}
  const idx=free[Math.floor(Math.random()*free.length)];used.push(idx);S.used[t]=used;
  const x=Q[idx];S.q={idx,t,opts:shuffle([x.ok,...x.bad]),chosen:null,left:30};S.joker=false;S.screen='q';save();render();
}

/* ---------- QUESTION ---------- */
function refBox(i){const r=REFS[i];
  if(!r)return `<div class="refbox none">Pas de passage correspondant dans le référentiel PSE 2026.</div>`;
  return `<div class="refbox"><div class="rh">Référentiel PSE 2026 · ${esc(r.c)}<b>${esc(r.h)}</b></div>${r.x.split('\n').map(l=>`<p>${esc(l)}</p>`).join('')}</div>`}
function vQ(){
  const x=Q[S.q.idx],t=THEMES[S.q.t],done=S.q.chosen!==null,p=S.players[S.cur];
  const good=done&&S.q.chosen===x.ok;
  const btns=S.q.opts.map((o,i)=>{let c='';if(done){if(o===x.ok)c='ok';else if(o===S.q.chosen)c='ko';else c='dim'}
    return `<button data-ans="${i}" class="${c}" ${done?'disabled':''}>${esc(o)}</button>`}).join('');
  let verdict='';
  if(done){const timeout=S.q.chosen==='__timeout__';
    verdict=`<div class="verdict"><b style="color:${good?'#1d8a55':'#c22f29'}">${good?'Bonne réponse !':timeout?'Temps écoulé…':'Raté…'}</b>${good?'':`Réponse : ${esc(x.ok)}.<br>`}${esc(x.exp)}</div>${refBox(S.q.idx)}`}
  return `${topbar()}${chips()}<div class="qcard"><div class="qhead" style="background:${t.col}">${t.name}<span>${esc(p.name)}</span></div>
  ${S.timer&&!done?`<div class="timer"><i id="tbar" style="width:${S.q.left/30*100}%"></i></div>`:''}
  <div class="qbody"><p class="qtext">${esc(x.q)}</p><div class="ans">${btns}</div>${verdict}</div></div>
  ${done?`<button class="big" id="next">${good&&!won(p)&&S.again?'Rejouer':'Continuer'}</button>`:''}`;
}
function answer(o){
  clearInterval(tick);const x=Q[S.q.idx],p=S.players[S.cur];S.q.chosen=o;
  if(o===x.ok){p.pts++;if(!p.w[S.q.t])p.w[S.q.t]=true;S.q.gain=true}
  save();render();
}
function next(){
  const p=S.players[S.cur],good=S.q.chosen===Q[S.q.idx].ok;
  if(won(p)){S.screen='win';S.winner=S.cur}
  else{if(!(good&&S.again))S.cur=(S.cur+1)%S.players.length;S.screen='turn'}
  S.q=null;save();render();
}

/* ---------- WIN ---------- */
function vWin(){
  const w=S.players[S.winner];
  const rk=S.players.map((p,i)=>({p,i})).sort((a,b)=>wedges(b.p)-wedges(a.p)||b.p.pts-a.p.pts);
  return `<div class="win">${pie(w.w,'pie')}<div class="mut">Victoire de</div><h1>${esc(w.name)}</h1>
  <ol class="rank">${rk.map(({p})=>`<li>${pie(p.w)}${esc(p.name)}<span>${p.pts} pt${p.pts>1?'s':''}</span></li>`).join('')}</ol>
  <div class="row2"><button class="big" id="replay">Revanche</button><button class="sec" id="home">Menu</button></div></div>`;
}

/* ---------- REVUE ---------- */
function revCount(){const d=Object.values(REV.dec);const o=d.filter(x=>x==='out').length;return d.length?` · ${d.length}/${Q.length} vues${o?`, ${o} retirée${o>1?'s':''}`:''}`:''}
function vRev(){
  if(REV.i>=Q.length)return vRevEnd();
  const i=REV.i,x=Q[i],t=THEMES[x.t],d=REV.dec[x.q];
  return `<div class="top"><button id="revquit">‹ Menu</button><span class="mut">${i+1} / ${Q.length}</span></div>
  <div class="revbar"><i style="width:${(i+1)/Q.length*100}%"></i></div>
  <div class="qcard"><div class="qhead" style="background:${t.col}">${t.name}<span>${d==='out'?'Retirée':d==='ok'?'Validée':'À revoir'}</span></div>
  <div class="qbody"><p class="qtext">${esc(x.q)}</p><div class="ans"><button class="ok" disabled>${esc(x.ok)}</button>${x.bad.map(b=>`<button class="dim" disabled>${esc(b)}</button>`).join('')}</div>
  ${x.exp?`<div class="verdict">${esc(x.exp)}</div>`:''}${refBox(i)}</div></div>
  <div class="row2"><button class="big" id="rok">OK</button><button class="sec rout" id="rout">Retirer</button></div>
  <div class="row2" style="margin-top:8px"><button class="sec" id="rprev" ${i?'':'disabled'}>‹ Précédente</button><button class="sec" id="rnext">Suivante ›</button></div>
  <button class="sec" id="rend" style="margin-top:8px">Voir le bilan</button>`;
}
function vRevEnd(){
  const out=Q.filter(x=>REV.dec[x.q]==='out'),seen=Object.keys(REV.dec).length;
  const txt=out.map(x=>'- '+x.q).join('\n');
  return `<div class="top"><button id="revquit">‹ Menu</button><span class="mut">Bilan</span></div>
  <h2>${seen} question${seen>1?'s':''} vue${seen>1?'s':''} sur ${Q.length}</h2>
  <p class="mut">${out.length} retirée${out.length>1?'s':''}. Elles ne sortent déjà plus dans le jeu sur ce téléphone. Pour les supprimer pour de bon, copie la liste et envoie-la à Claude.</p>
  ${out.length?`<textarea id="revtxt" readonly style="width:100%;min-height:200px;font:14px/1.4 Archivo,sans-serif;border-radius:12px;padding:10px;border:1px solid #33497b;background:#0d1a35;color:var(--lt)">Questions à retirer du Trivial PSE :\n${esc(txt)}</textarea>
  <button class="big" id="revcopy" style="margin:10px 0">Copier la liste</button>`:''}
  <div class="row2"><button class="sec" id="rback">Reprendre la revue</button><button class="sec" id="rreset">Tout remettre à zéro</button></div>`;
}
function revGo(n){REV.i=Math.max(0,Math.min(Q.length,n));saveRev();render()}

/* ---------- RENDER / EVENTS ---------- */
function render(){
  clearInterval(tick);
  if(REVIEW){$('#app').innerHTML=vRev();window.scrollTo(0,0);return}
  const sc=S&&S.players?S.screen:'setup';
  $('#app').innerHTML=sc==='turn'?vTurn():sc==='q'?vQ():sc==='win'?vWin():vSetup();
  if(S&&S.screen==='q'&&S.timer&&S.q.chosen===null){
    tick=setInterval(()=>{S.q.left--;const b=$('#tbar');if(b)b.style.width=Math.max(0,S.q.left/30*100)+'%';if(S.q.left<=0)answer('__timeout__')},1000);
  }
  window.scrollTo(0,0);
}
function start(){
  readNames();
  const names=setup.names.map((n,i)=>n.trim()||`Joueur ${i+1}`);
  S={screen:'turn',players:shuffle(names).map(name=>({name,w:[0,0,0,0,0,0].map(()=>false),pts:0})),cur:0,goal:setup.goal,pts:+setup.pts,mode:setup.mode,timer:setup.timer,again:setup.again,used:S&&S.used||{},q:null,joker:false};
  save();render();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='add'){readNames();setup.names.push('');save();render();$('#pn'+(setup.names.length-1)).focus();return}
  if(b.dataset.del){readNames();setup.names.splice(+b.dataset.del,1);save();render();return}
  if(b.dataset.set){readNames();setup[b.dataset.set]=b.dataset.v;save();render();return}
  if(b.dataset.tog){readNames();setup[b.dataset.tog]=!setup[b.dataset.tog];save();render();return}
  if(b.id==='start'){start();return}
  if(b.id==='review'){REVIEW=true;render();return}
  if(b.id==='revquit'){REVIEW=false;render();return}
  if(b.id==='rok'||b.id==='rout'){REV.dec[Q[REV.i].q]=b.id==='rok'?'ok':'out';revGo(REV.i+1);return}
  if(b.id==='rprev'){revGo(REV.i-1);return}
  if(b.id==='rnext'){revGo(REV.i+1);return}
  if(b.id==='rend'){revGo(Q.length);return}
  if(b.id==='rback'){const k=Q.findIndex(x=>!REV.dec[x.q]);revGo(k<0?0:k);return}
  if(b.id==='rreset'){if(b.dataset.c){REV={i:0,dec:{}};saveRev();render()}else{b.dataset.c=1;b.textContent='Confirmer la remise à zéro'}return}
  if(b.id==='revcopy'){const t=$('#revtxt');t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>{b.textContent='Copié !'},()=>{try{document.execCommand('copy');b.textContent='Copié !'}catch(e){b.textContent='Sélectionne le texte et copie-le'}});return}
  if(b.id==='resume'){if(S.screen==='setup')S.screen=S.q?'q':'turn';save();render();return}
  if(b.id==='menu'||b.id==='home'){if(S.screen!=='win'&&S.q&&S.q.chosen===null){S.used[S.q.t]=(S.used[S.q.t]||[]).filter(i=>i!==S.q.idx);S.q=null}
    if(S.screen==='win')S={used:S.used,screen:'setup'};else S.screen='setup';save();render();return}
  if(b.id==='die'){roll();return}
  if(b.dataset.theme){ask(+b.dataset.theme);return}
  if(b.dataset.ans){answer(S.q.opts[+b.dataset.ans]);return}
  if(b.id==='next'){next();return}
  if(b.id==='replay'){start();return}
});
document.addEventListener('input',e=>{if(e.target.id&&e.target.id.startsWith('pn')){readNames();save()}});
render();
}
</script></body></html>
