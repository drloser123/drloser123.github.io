<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trivial PSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: soirée de révision entre secouristes, joueur et net
   IDEA: le plateau et les camemberts du Trivial, version poste de secours
   PICTURE: le camembert du joueur en cours, grand, qui se remplit
   COLOUR and TYPE: plateau bleu nuit, 6 couleurs de thèmes, cartes blanches; Archivo
   LAYOUT: une colonne mobile, bandeau des joueurs, camembert, action */
:root{color-scheme:dark;--bg:#0d1a35;--bg2:#15264a;--card:#fff;--ink:#0d1a35;--lt:#e9eefb;--mut:#9fb0d6;--acc:#ff7a1a}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
html{background:var(--bg)}
body{background:radial-gradient(120% 70vh at 50% 0%,#1d3466 0%,var(--bg) 70%) no-repeat;background-color:var(--bg);color:var(--lt);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip}
.app{max-width:560px;margin:0 auto;padding:16px max(4vw,14px) 40px;min-height:100%}
h1{font-weight:900;font-size:40px;line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-weight:800;font-size:24px;line-height:1.15;margin:0 0 12px;text-wrap:balance}
.mut{color:var(--mut);font-size:15px}
.hero{display:flex;align-items:center;gap:16px;margin:8px 0 22px}
.hero svg{width:96px;height:96px;flex:none;filter:drop-shadow(0 6px 14px #0008)}
.panel{background:var(--bg2);border:1px solid #2a3f6e;border-radius:18px;padding:16px;margin-bottom:14px}
label.l{display:block;font-weight:600;font-size:14px;color:var(--mut);margin-bottom:8px}
.prow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
input[type=text]{flex:1;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1px solid #33497b;background:#0d1a35;color:var(--lt);min-height:44px}
input:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;min-height:44px;padding:10px 16px;font-weight:700}
.x{background:transparent;color:var(--mut);font-size:22px;width:44px;padding:0}
.ghost{background:transparent;color:var(--lt);border:1px dashed #4a6199;width:100%}
.big{width:100%;background:var(--acc);color:#1a0d00;font-size:19px;font-weight:900;min-height:56px;box-shadow:0 6px 0 #b04e05}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #b04e05}
.big:disabled{opacity:.4}
.sec{background:#243a6b;color:var(--lt);width:100%}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{background:#0d1a35;color:var(--lt);border:1px solid #33497b;font-size:14px;padding:8px 6px;line-height:1.2}
.seg button.on{background:var(--lt);color:var(--ink);border-color:var(--lt)}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0}
.sw{width:56px;height:32px;border-radius:20px;background:#33497b;position:relative;padding:0;min-height:0;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--acc)}.sw.on::after{left:28px}
.leg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;font-size:14px}
.leg div{display:flex;gap:8px;align-items:center}
.bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:30px;background:var(--bg2);border:2px solid transparent;font-size:14px;font-weight:600}
.chip.cur{border-color:var(--acc);background:#22396b}
.chip svg{width:30px;height:30px}
.chip b{font-weight:900}
.stage{text-align:center}
.stage .who{font-size:15px;color:var(--mut)}
.stage .name{font-size:34px;font-weight:900;line-height:1.1;margin:2px 0 10px;text-wrap:balance}
.pie{width:min(62vw,250px);height:min(62vw,250px);margin:6px auto 14px;display:block;filter:drop-shadow(0 10px 24px #000a)}
.die{width:150px;height:150px;margin:0 auto 14px;border-radius:26px;display:grid;place-items:center;text-align:center;font-weight:900;font-size:15px;line-height:1.2;padding:12px;overflow:hidden;overflow-wrap:break-word;hyphens:auto;color:#fff;background:#243a6b;box-shadow:inset 0 -8px 0 #0004,0 8px 20px #0008;transition:background .12s}
.die.roll{animation:wob .9s ease}
.die:not(:disabled):active{transform:translateY(4px);box-shadow:inset 0 -4px 0 #0004,0 4px 12px #0008}.die:disabled{opacity:1;cursor:default}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg) scale(1.05)}50%{transform:rotate(10deg)}75%{transform:rotate(-6deg)}}
.pick{display:grid;gap:8px;margin-bottom:12px}
.pick button{display:flex;align-items:center;gap:12px;text-align:left;background:var(--bg2);color:var(--lt);border:1px solid #2a3f6e}
.pick button .dot{width:18px;height:18px}
.pick small{display:block;color:var(--mut);font-weight:400;font-size:13px}
.qcard{background:var(--card);color:var(--ink);border-radius:20px;overflow:hidden;box-shadow:0 14px 34px #0009;margin-bottom:14px}
.qhead{padding:12px 16px;color:#fff;font-weight:800;display:flex;justify-content:space-between;gap:10px;align-items:center}
.qhead span{font-size:14px;font-weight:600;opacity:.9;white-space:nowrap}
.qbody{padding:16px}
.qtext{font-size:20px;font-weight:800;line-height:1.25;margin:0 0 14px;text-wrap:pretty}
.ans{display:grid;gap:8px}
.ans button{text-align:left;background:#eef2fa;color:var(--ink);font-weight:600;border:2px solid #dbe3f3;line-height:1.3;padding:12px 14px}
.ans button.ok{background:#d9f5e5;border-color:#2bb673}
.ans button.ko{background:#fde0de;border-color:#e5413b}
.ans button:disabled{cursor:default}
.ans button.dim{opacity:.55}
.verdict{margin-top:14px;padding:12px 14px;border-radius:14px;background:#f3f5fb;font-size:15px}
.verdict b{display:block;font-size:17px;margin-bottom:2px}
.verdict .ref{display:inline-block;margin-top:6px;font-size:13px;color:#4a5878;font-weight:600}
.refbox{margin-top:10px;padding:12px 14px;border-radius:14px;background:#eef3fb;border-left:4px solid #2f7de1;font-size:14.5px;line-height:1.45;color:#22304d}
.refbox .rh{font-size:12.5px;color:#4a5878;font-weight:600;margin-bottom:6px}.refbox .rh b{display:block;font-size:14px;color:#0d1a35;font-weight:800}
.refbox p{margin:0 0 4px}.refbox.none{border-left-color:#b9c3d8;color:#5b6886;font-size:13.5px;background:#f3f5fb}
.revbar{height:6px;border-radius:4px;background:#24365f;margin-bottom:12px;overflow:hidden}.revbar i{display:block;height:100%;background:var(--acc)}
.rout{background:#5a2330;color:#ffd9de}
.sec:disabled{opacity:.4}
.timer{height:6px;background:#0002}.timer i{display:block;height:100%;background:#fff;width:100%;transition:width 1s linear}
.win{text-align:center;padding-top:20px}
.rank{list-style:none;padding:0;margin:16px 0;text-align:left}
.rank li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--bg2);margin-bottom:6px;font-weight:700}
.rank li svg{width:36px;height:36px}
.rank li span{margin-left:auto;font-weight:900}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.foot{margin-top:18px;font-size:13px;color:var(--mut);text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.top button{background:transparent;color:var(--mut);font-size:14px;padding:6px 8px;min-height:36px;font-weight:600}
@media(prefers-reduced-motion:reduce){.die.roll{animation:none}.sw::after{transition:none}}
@media(max-width:380px){h1{font-size:32px}.qtext{font-size:18px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const THEMES=[
{id:0,name:"Bilan & urgences vitales",sub:"SSS, XABCD, SAMPLE, acronymes",col:"#e5413b"},
{id:1,name:"Respiration",sub:"Fréquences, signes, O2, aspiration",col:"#2f7de1"},
{id:2,name:"Circulation",sub:"FC, tension, TRC, douleur thoracique",col:"#f2c230"},
{id:3,name:"Neuro, glycémie, T°",sub:"Glasgow, AVC, convulsions, GLY, T°",col:"#9b59d0"},
{id:4,name:"Traumas, plaies, brûlures",sub:"Immo, rachis, plaies, brûlures",col:"#f08a24"},
{id:5,name:"Grossesse & accouchement",sub:"Termes, pathologies, Malinas, APGAR",col:"#2bb673"}];
const Q=[];
function q(t,question,ok,bad,exp,ref){Q.push({t,q:question,ok,bad,exp,ref})}

/* ---------- 0 · BILAN & URGENCES VITALES ---------- */
q(0,"Que désignent les trois « S » du début de bilan ?","Sécurité, Scène, Situation",["Sécurité, Secours, Surveillance","Signes, Symptômes, Scores","Scène, Soins, Santé"],"Sécurité : dangers, renforts utiles. Scène : freins, accès, infos de départ. Situation : événements, mécanismes, victimes, plainte.","SSS");
q(0,"Dans XABCD, que désigne le X ?","L’hémorragie",["L’examen complet","Le danger","L’arrêt cardiaque"],"Puis A obstruction complète, B arrêt ventilatoire, C ACR, D inconscience.","X");
q(0,"Hémorragie sans corps étranger : premier geste ?","Compression directe",["Garrot","GISH","Pansement compressif d’emblée"],"Inefficace ou impossible : garrot. Efficace : pose d’un PCU.","X");
q(0,"Hémorragie : la compression directe est efficace. Ensuite ?","Pose d’un PCU",["Garrot","Relâcher pour vérifier","GISH systématique"],"PCU inefficace : reprendre la compression, puis GISH ou garrot.","X");
q(0,"Hémorragie avec corps étranger dans la plaie :","Poser un garrot",["Compression directe sur l’objet","Retirer l’objet puis comprimer","PCU serré"],"En zone garrottable uniquement.","X");
q(0,"Où placer le garrot ?","5 à 7 cm au-dessus de la plaie, en zone garrottable uniquement",["Au plus près de la plaie","À la racine du membre systématiquement","20 cm au-dessus de la plaie"],"","X");
q(0,"Combien de temps maintenir une GISH avant de poser le PCU ?","3 minutes",["30 secondes","10 minutes","Jusqu’à l’hôpital"],"GISH : gaze imprégnée de substance hémostatique.","X");
q(0,"Obstruction complète des voies aériennes :","5 claques dans le dos, puis 5 compressions, à recommencer",["30 compressions puis 2 insufflations","Une seule série de claques","Faire boire de l’eau"],"Jusqu’à amélioration ou perte de connaissance. Arrêter si toux ou bruit.","A");
q(0,"Obstruction complète : la victime perd connaissance.","RCP, sans insufflations starter",["PLS","Continuer les claques dans le dos","5 insufflations initiales"],"","A");
q(0,"LVA chez une victime traumatisée :","Subluxation de la mâchoire",["Bascule de la tête","Aucune LVA","PLS immédiate"],"Sans trauma : bascule de la tête.","A");
q(0,"À partir de quelle FR parle-t-on d’arrêt ventilatoire ?","FR ≤ 6",["FR ≤ 12","FR ≤ 10","FR = 0 seulement"],"Insufflations avec apport d’O2 à 15 l/min et surveillance +++.","B");
q(0,"Arrêt ventilatoire : rythme des insufflations chez l’adulte ?","10 par minute",["20 par minute","30 par minute","5 par minute"],"Adulte et enfant 10/min, nourrisson 20/min, nouveau-né 30/min.","B");
q(0,"Arrêt ventilatoire : rythme des insufflations chez le nourrisson ?","20 par minute",["10 par minute","30 par minute","40 à 60 par minute"],"30/min chez le nouveau-né.","B");
q(0,"ACR chez l’adulte noyé : particularité ?","5 insufflations initiales",["Pas d’insufflation","15/2 au lieu de 30/2","Pas de DSA"],"Sinon cardio-pompe 30/2, DSA, alerte, O2 15 l/min.","C");
q(0,"ACR chez l’enfant :","5 insufflations initiales puis RCP 15/2",["RCP 30/2 directement","3/1","5 insufflations puis 30/2"],"DSA et O2 à 15 l/min.","C");
q(0,"Pendant la RCP, à partir de combien de secouristes recherche-t-on le pouls en insufflant ?","3",["2","4","Dès 1"],"Pouls présent et FR ≤ 6 : CàT arrêt ventilatoire.","C");
q(0,"Inconscience sans trauma :","PLS à 1 secouriste",["Maintien LVA sur le dos","PLS à 2 sur avis médical","Position assise"],"Aspiration si nécessaire, contact urgent après tension, température, glycémie.","D");
q(0,"Inconscience avec trauma :","Maintenir la LVA, victime allongée sur le dos ou assise",["PLS à 1 secouriste","Retourner sur le ventre","Asseoir jambes pendantes"],"PLS à 2 seulement sur avis médical.","D");
q(0,"Dans SAMPLE, que veut dire le L ?","Last meal (dernier repas)",["Lésions","Localisation","Liquides"],"Signes, Allergies, Médicaments, Passé médical, Last meal, Événements.","SAMPLE");
q(0,"Dans SAMPLE, que veut dire le P ?","Passé médical",["Pouls","Provoqué par","Pupilles"],"","SAMPLE");
q(0,"Dans OPQRST, que veut dire le O ?","Onset : circonstance d’apparition des symptômes",["Oxygène","Orientation","Observation"],"Arrivée progressive ou subite…","OPQRST");
q(0,"OPQRST : comment mesurer la Sévérité ?","EVS (nulle à insupportable) ou EN de 0 à 10",["Glasgow","Malinas","FAST"],"","OPQRST");
q(0,"Membre traumatisé : que vérifier en distal ?","Mouvements, sensibilité, TRC, pouls, chaleur",["Face, bras, parole, temps","Glycémie et température","Uniquement la douleur"],"Plus : coloration, déformation, gonflement.","SAMPLE");

/* ---------- 1 · RESPIRATION ---------- */
q(1,"Fréquence respiratoire normale de l’adulte ?","12 à 20/min",["20 à 30/min","8 à 12/min","30 à 40/min"],"","B");
q(1,"Fréquence respiratoire normale de l’enfant ?","20 à 30/min",["12 à 20/min","30 à 40/min","40 à 60/min"],"","B");
q(1,"Fréquence respiratoire normale du nourrisson ?","30 à 40/min",["20 à 30/min","40 à 60/min","12 à 20/min"],"","B");
q(1,"Fréquence respiratoire normale du nouveau-né ?","40 à 60/min",["30 à 40/min","60 à 80/min","20 à 30/min"],"","B");
q(1,"Quels sont les signes visibles d’une détresse respiratoire ?","Cyanose, tirages, balancement thoraco-abdominal, battement des ailes du nez",["Pâleur, marbrures, conjonctives décolorées","Cyanose, purpura, raideur de nuque, photophobie","Rougeur du visage, peau sèche, frissons"],"Signe général : sueurs chaudes.","B");
q(1,"Quels bruits respiratoires évoquent une détresse respiratoire ?","Sifflements, ronflements, râles crépitants",["Souffle cardiaque, sifflements, toux sèche","Hoquet, ronflements, éternuements","Claquements de dents, gargouillis abdominaux"],"","B");
q(1,"Un signe simple de détresse respiratoire à tester ?","Difficulté à compter jusqu’à 10",["Incapacité à lever les bras","Pupilles asymétriques","Soif intense"],"","B");
q(1,"SpO2 cible dans le cas général ?","94 à 98 %",["89 à 94 %","92 à 96 %","100 %"],"","B");
q(1,"SpO2 cible chez l’insuffisant respiratoire chronique (IRC) ?","89 à 94 %",["94 à 98 %","92 à 96 %","80 à 85 %"],"","B");
q(1,"SpO2 cible donnée pour le COVID ?","92 à 96 %",["94 à 98 %","89 à 94 %","96 à 100 %"],"","B");
q(1,"Plage de débit du masque haute concentration (MHC) ?","9 à 15 l/min",["6 à 9 l/min","1 à 6 l/min","15 à 25 l/min"],"","B");
q(1,"Plage de débit du masque moyenne concentration (MMC) ?","6 à 9 l/min",["9 à 15 l/min","1 à 6 l/min","3 à 5 l/min"],"","B");
q(1,"Plage de débit des lunettes à oxygène ?","1 à 6 l/min",["6 à 9 l/min","9 à 15 l/min","10 à 12 l/min"],"","B");
q(1,"Dans quels cas donne-t-on de l’O2 à 15 l/min quelle que soit la SpO2 ?","Intoxication CO ou fumées, accident de plongée ou décompression, crise drépanocytaire, détresse sans SpO2 mesurable, gelure > 4000 m, opiacés avec FR < 12 ou inconscience, hypothermie modérée ou sévère, éclampsie",["Intoxication CO ou fumées, accident de plongée, crise d’asthme, fièvre élevée, hypoglycémie, toute douleur thoracique","Détresse sans SpO2 mesurable, gelure > 4000 m, toute victime de plus de 65 ans, brûlure simple, crise d’angoisse","Opiacés avec FR < 12, hypothermie légère, entorse grave, éclampsie, malaise vagal, saignement de nez"],"","B");
q(1,"Intoxication aux opiacés : quand donner l’O2 à 15 l/min ?","FR < 12 ou inconscience",["FR > 20","Toujours, même conscient avec FR normale","Jamais"],"","B");
q(1,"Lequel N’est PAS une indication d’O2 à 15 l/min citée ?","Fièvre",["Crise drépanocytaire","Hypothermie modérée ou sévère","Éclampsie (BSP)"],"","B");
q(1,"Calibre de sonde d’aspiration chez l’adulte ?","CH 18 à 26",["CH 8 à 12","CH 6 à 8","CH 4 à 6"],"Dépression 350 à 500 mmHg.","Aspiration");
q(1,"Calibre de sonde d’aspiration chez le nourrisson ?","CH 6 à 8",["CH 4 à 6","CH 8 à 12","CH 18 à 26"],"200 à 250 mmHg.","Aspiration");
q(1,"Dépression d’aspiration chez le nouveau-né ?","120 à 150 mmHg (0,16 à 0,20 bar)",["350 à 500 mmHg","200 à 350 mmHg","50 à 80 mmHg"],"Sonde CH 4 à 6.","Aspiration");
q(1,"Asthme : quel bruit caractéristique ?","Sifflement expiratoire",["Râles crépitants","Stridor inspiratoire","Ronflement"],"FR élevée. Rechercher la dernière crise et un passage en réa/déchoc.","Asthme");
q(1,"Quels sont les signes d’un OAP ?","Toux, râles crépitants, ronflement, mousse aux lèvres (rougeâtre ou blanchâtre), hypertension puis hypotension, désaturation",["Sifflement expiratoire, FR élevée, crise allergique ou à l’effort","Douleur basithoracique en point de côté, angoisse, phlébite","Douleur rétrosternale constrictive irradiant au bras gauche"],"Facteurs de risque : âge avancé, antécédents cardiaques, consommation excessive de sel.","OAP");
q(1,"OAP : position ?","Assise, jambes pendantes",["Allongée jambes surélevées","PLS","Demi-assise jambes surélevées"],"Demi-assise si détresse circulatoire.","OAP");
q(1,"Quels sont les facteurs de risque de l’OAP ?","Âge avancé, antécédents cardiaques, consommation excessive de sel",["Pilule, tabac, immobilisation, plongée","Allergie, effort, dernière crise récente","Séjour en altitude, grossesse, voyage en avion"],"","OAP");
q(1,"Position d’une victime en détresse respiratoire (hors OAP) ?","Assise ou demi-assise",["Allongée à plat","PLS","Jambes surélevées"],"","B");

/* ---------- 2 · CIRCULATION ---------- */
q(2,"Fréquence cardiaque normale de l’adulte ?","60 à 100/min",["70 à 140/min","100 à 160/min","50 à 80/min"],"","C");
q(2,"Fréquence cardiaque normale de l’enfant ?","70 à 140/min",["60 à 100/min","100 à 160/min","120 à 160/min"],"","C");
q(2,"Fréquence cardiaque normale du nourrisson ?","100 à 160/min",["70 à 140/min","60 à 100/min","120 à 180/min"],"","C");
q(2,"Fréquence cardiaque normale du nouveau-né ?","120 à 160/min",["100 à 160/min","70 à 140/min","160 à 200/min"],"","C");
q(2,"Lequel N’est PAS un « autre » signe de détresse circulatoire ?","Difficulté à compter jusqu’à 10",["Sensation de soif","Arythmie","Extrémités froides"],"Ça, c’est un signe respiratoire.","C");
q(2,"Détresse circulatoire : sous quelle pression artérielle systolique ?","< 90 mmHg, ou baisse de plus de 30 % chez l’hypertendu",["< 120 mmHg","< 100 mmHg","< 60 mmHg"],"Avec un TRC > 2 s et une FC > 120 ou < 40.","C");
q(2,"Tension adulte : seuil d’hypertension ?","> 160 mmHg",["> 120 mmHg","> 140 mmHg","> 200 mmHg"],"La PA normale de l’adulte au repos oscille autour de 100/80 mmHg.","C");
q(2,"TRC normal chez l’adulte, au lit de l’ongle ?","Moins de 2 secondes",["Moins de 5 secondes","Moins d’1 seconde","Moins de 10 secondes"],"","C");
q(2,"TRC chez l’enfant de moins de 6 ans (BSP) : seuil et sites ?","5 s, pulpe des doigts, plante du pied, thorax, abdomen",["2 s, lit de l’ongle","10 s, front","1 s, lobe de l’oreille"],"","C");
q(2,"Angor : quelle douleur ?","Médio-thoracique rétrosternale constrictive, irradiant bras/mâchoire",["Basithoracique en point de côté","Violente, migrant d’une épaule à l’autre","Abdominale en barre"],"","C");
q(2,"Angor : en combien de temps cède-t-il après un vasodilatateur ?","2 minutes",["20 minutes","10 secondes","Il ne cède pas"],"Et 20 min après l’arrêt de l’effort.","C");
q(2,"Qu’est-ce qui distingue le SCA de l’angor ?","Il ne cède pas au repos ni au vasodilatateur",["Il n’y a pas de douleur","Il touche seulement les jeunes","La douleur est dans le dos"],"Mêmes symptômes et facteurs de risque.","C");
q(2,"Douleur basithoracique en point de côté, angoisse, phlébite :","Embolie",["Angor","Dissection aortique","OAP"],"","C");
q(2,"Quels sont les facteurs de risque de l’embolie ?","Immobilisations (voyage, plâtre, alitement), plongée, séjour en altitude, grossesse/accouchement, tabac, pilule",["Surpoids, diabète, tabac, HTA, cholestérol, athérosclérose","Âge, antécédents familiaux, traumatisme avec cisaillement","Âge avancé, antécédents cardiaques, excès de sel"],"Le 2e choix correspond à l’angor, le 3e à la dissection aortique.","C");
q(2,"Douleur violente qui se déplace d’une épaule à l’autre, sans effort :","Dissection aortique",["Embolie","Angor","SCA"],"","C");
q(2,"Dissection aortique : quel signe à la prise de tension ?","Asymétrie de tension > 20 mmHg entre les bras",["Tension > 160 aux deux bras","Tension imprenable","Aucune différence"],"","C");

/* ---------- 3 · NEURO, GLYCÉMIE, T° ---------- */
q(3,"Comment s’appelle l’asymétrie des pupilles ?","Anisocorie",["Mydriase","Myosis","Nystagmus"],"On évalue taille, réactivité et symétrie.","D");

q(4,"Rappel antitétanique : à partir de quand conseiller un médecin chez l’adulte ?","Rappel de plus de 10 ans",["Rappel de plus de 2 ans","Rappel de plus de 20 ans","Jamais"],"Plus de 5 ans chez l’enfant.","FC");
q(4,"Dans quel cas NE pose-t-on PAS de collier cervical ?","Étranglement ou pendaison",["Victime assise relevée à l’ACT","Victime debout relevée au plan dur","Maintien de tête périlleux"],"","FC");
q(5,"Qu’est-ce qu’une métrorragie ?","Un saignement d’origine vaginale",["Du sang dans les urines","Un saignement de nez","Du sang digéré"],"","FC");
q(5,"Placenta prævia :","Le placenta recouvre l’orifice interne du col",["Le placenta est au fond de l’utérus","Le cordon est enroulé autour du cou","Le bébé se présente par le siège"],"Cause de saignements rouges récidivants pendant la grossesse.","FC");
q(5,"Endométriose : environ quelle part des femmes ?","10 %",["1 %","30 %","50 %"],"Muqueuse utérine présente en dehors de l’utérus.","FC");
q(5,"De quelle couleur est un liquide amniotique méconial ?","Marron",["Clair","Rouge vif","Bleu"],"À transmettre dans le bilan de la parturiente.","FC");
q(2,"Tension artérielle normale chez l’adulte au repos ?","Environ 100 mmHg de systolique et 80 de diastolique",["Environ 120/80 mmHg","Environ 160/90 mmHg","Environ 70/40 mmHg"],"Détresse circulatoire si systolique < 90 mmHg.","FC");
q(3,"Glycémie moyenne à jeun ?","0,8 g/l (4,4 mmol/l)",["0,6 g/l","1,26 g/l","1,5 g/l"],"Normale entre 0,6 et 1,26 g/l.","FC");
q(5,"Qu’appelle-t-on une parturiente ?","Une femme enceinte dont le travail a commencé",["Toute femme enceinte","Une femme qui vient d’accoucher","Une femme enceinte de plus de 37 SA"],"","GRO");
q(5,"Quelles sont les trois étapes de l’accouchement, dans l’ordre ?","Le travail, l’expulsion, la délivrance",["L’expulsion, le travail, la délivrance","Le travail, la délivrance, l’expulsion","La perte des eaux, le travail, l’expulsion"],"","GRO");
q(5,"La délivrance survient généralement…","20 à 30 minutes après la sortie du nouveau-né",["Juste avant l’expulsion","Immédiatement après la naissance","2 à 3 heures après la naissance"],"C’est la sortie du placenta et du reste du cordon.","GRO");
q(5,"Femme enceinte avant l’accouchement : comment l’installer ?","Sur le côté, de préférence le gauche ; le dos est à proscrire",["Sur le dos, jambes fléchies","Assise, jambes pendantes","Debout, en marchant"],"","GRO");
q(5,"À partir de quand demander à la parturiente de pousser ?","Quand le haut du crâne apparaît à la vulve, ou qu’elle ressent un besoin irrépressible de pousser",["Dès la perte des eaux","Dès la première contraction","Seulement quand le médecin est arrivé"],"Pousser vers le bas en retenant sa respiration, jusqu’au maximum de la contraction.","GRO");
q(5,"La tête du bébé est sortie mais ne tourne pas :","Faire arrêter de pousser et vérifier s’il y a un circulaire du cordon",["Tirer doucement sur la tête","Faire pousser plus fort","Tourner la tête d’un quart de tour"],"En présence d’un circulaire, le dégager.","GRO");
q(5,"Juste après la naissance, que noter ?","L’heure de naissance",["Le poids du bébé","La couleur des yeux","La durée totale du travail"],"","GRO");
q(5,"Pendant la délivrance, que faire du placenta ?","Le laisser sortir sans tirer, le recueillir et l’acheminer avec la mère à l’hôpital",["Tirer sur le cordon pour l’aider à sortir","Le jeter une fois sorti","Le laisser dans l’utérus jusqu’à l’hôpital"],"Pour que l’hôpital vérifie son intégrité.","GRO");
q(5,"Le placenta n’est pas sorti 30 minutes après la naissance :","Réaliser un massage utérin",["Tirer sur le cordon","Faire boire la mère","Attendre sans rien faire"],"Pour prévenir une hémorragie.","GRO");
q(5,"Massage utérin sans hémorragie : à quel rythme ?","Pendant 1 minute, toutes les 10 minutes",["En continu","Une seule fois","Pendant 10 minutes, toutes les heures"],"En continu en cas d’hémorragie. Prévenir la mère : le geste est très douloureux.","GRO");
q(5,"Où poser le nouveau-né dès la naissance ?","Sur le ventre de sa mère, sur le côté, peau contre peau, tête bien dégagée",["Sur une table, à plat dos","Dans les bras d’un secouriste","Dans le sac à bébé immédiatement"],"","GRO");
q(5,"À quoi reconnaît-on un nouveau-né en bonne santé ?","Respiration et cri vigoureux, tonus vif",["Peau pâle et calme","Yeux ouverts et pleurs faibles","FC à 80, respiration lente"],"Une pâleur doit alerter et être transmise dans le bilan.","GRO");
q(5,"Comment protéger un nouveau-né du froid ?","Sécher par tamponnement, l’envelopper sauf la face, couvrir la tête d’un bonnet",["Le laver à l’eau tiède","Le frotter vigoureusement","Le laisser nu sur la mère sans le couvrir"],"","GRO");
q(5,"Soin au cordon : comment procéder ?","1er clamp à 10-15 cm de l’ombilic, vider le cordon sur 3-5 cm, 2e clamp, couper entre les deux",["Couper d’abord, puis poser les clamps","Un seul clamp au ras du ventre","Nouer le cordon avec une compresse"],"Puis recouvrir d’une compresse stérile.","GRO");
q(5,"Comment transporter un nouveau-né ?","Dans un système fermé et fixé (incubateur, lit-auto)",["Dans les bras de la mère","Sur le brancard à côté de la mère","Dans les bras d’un secouriste"],"","GRO");

const REFS=[{"c":"04AC01","h":"Généralités sur les bilans","x":"L’approche chronologique du bilan distingue 4 regards successifs :\nLe premier regard apprécie la situation dans sa globalité pour déceler d’éventuels dangers pour l’équipe, la victime et son environnement ;\nLe deuxième regard progresse vers la victime et a pour objectif d’identifier une menace vitale ainsi que la plainte principale ;\nLe troisième regard repose sur une évaluation hiérarchisée et structurée des fonctions vitales, l’une après l’autre pour rechercher une détresse vitale moins évidente ;\nLe quatrième regard permet de compléter l’évaluation en approfondissant l’interrogatoire, en examinant la victime et en poursuivant la mesure des paramètres vitaux."},{"c":"04PR02","h":"Deuxième regard","x":"La présence de menaces vitales nécessitant une réaction immédiate en respectant le principe de « traiter en priorité ce qui tue en premier » (tableau 2).\nTableau 3: Les menaces vitales et les actions à entreprendre\nMENACE(S) VITALE(S) A RECHERCHER1\nACTION(S) A ENTREPRENDRE\nHémorragie externe grave\nArrêter l’hémorragie"},{"c":"05PR01","h":"Hémorragies externes","x":"arrêter immédiatement l’hémorragie :\nen demandant à la victime de comprimer immédiatement l’endroit qui saigne ;\nou à défaut, le faire1 à sa place ;\nmaintenir la compression (par la victime ou le sauveteur) ;"},{"c":"05PR01","h":"Hémorragies externes","x":"mettre en place :\nun pansement compressif si l’hémorragie est contrôlée manuellement et pour se libérer ;\nsi la compression (manuelle et pansement compressif) est inefficace3 ou impossible4, utiliser :\nsoit un garrot si la zone est « garrotable »,\nsoit une gaze imbibée d'une substance hémostatique si la zone est « non garrotable »."},{"c":"05PR01","h":"Hémorragies externes","x":"Cas particulier : fracture ouverte et corps étranger\nSi la victime présente une fracture ouverte, avec un morceau d’os visible ou si la plaie qui saigne contient un corps étranger visible :\nne toucher ni au morceau d’os ni au corps étranger, car leur présence peut limiter le saignement et leur mobilisation pourrait aggraver la lésion.\nSi le saignement reste important et massif, poser un garrot."},{"c":"05FT04","h":"Garrot","x":"positionner le garrot :\nà quelques centimètres de la plaie (idéalement 5 à 7 cm),\nentre la plaie et la racine du membre,\njamais sur une articulation."},{"c":"05FT05","h":"Gaze imbibée de substance hémostatique","x":"faire pénétrer la gaze à l’intérieur de la plaie, au contact direct de la source du saignement ;\nexercer une pression pendant au minimum 3 min et jusqu'à l’arrêt du saignement ;\nUne fois le saignement arrêté :\nréaliser la pose d’un pansement compressif pour maintenir en place la gaze imbibée de substance hémostatique et maintenir la pression.\nnoter : le nombre de gazes hémostatiques utilisés et l’heure de la pose et leurs localisations."},{"c":"05PR03","h":"Obstruction des voies aériennes","x":"Si la victime ne peut plus parler, crier, tousser3\nlaisser la victime dans la position où elle se trouve, généralement debout ou assise ;\ndonner de 1 à 5 « claques dans le dos » ;\nréaliser de 1 à 5 « compressions » en cas d’inefficacité ou d’impossibilité de pratiquer des « claques » :\nau niveau abdominal s’il s’agit d’un adulte ou d’un enfant,\nau niveau thoracique s’il s’agit :\nd’un nourrisson,\nd’un personne obèse ou d’une femme enceinte, s’il est impossible d’encercler l’abdomen ;\nd’une personne alitée ou allongée, difficilement mobilisable.\nrépéter le cycle « claques dans le dos » et « compressions » ;"},{"c":"05PR03","h":"Obstruction des voies aériennes","x":"Si la victime perd connaissance\nl’accompagner au sol ;\nréaliser une réanimation cardio-pulmonaire."},{"c":"04FT05","h":"Libération des voies aériennes chez une victime traumatisée","x":"Réalisation\nEn même temps que l’on maintient la tête à deux mains :\nplacer l’index ou le majeur de chaque main derrière l’angle de la mâchoire et sous les oreilles de la victime ;\nouvrir la bouche avec les pouces placés sur le menton ;\npousser vers l’avant la mâchoire inférieure ;\nmaintenir cette position."},{"c":"05PR04","h":"Arrêt cardiaque en équipe","x":"si un pouls est perçu (hors compressions) et que la ventilation est absente ou anormale (FR ≤ 6 mvts/min) :\ninterrompre les compressions thoraciques ;\npoursuivre les insufflations à la fréquence de :\nAdulte / Enfant : 10 insufflations/min\nNourrisson : 20 insufflations/min\nNouveau-né : 30 insufflations/min"},{"c":"05PR04","h":"Arrêt cardiaque en équipe","x":"si un pouls est perçu (hors compressions) et que la ventilation est absente ou anormale (FR ≤ 6 mvts/min) :\ninterrompre les compressions thoraciques ;\npoursuivre les insufflations à la fréquence de :\nAdulte / Enfant : 10 insufflations/min\nNourrisson : 20 insufflations/min\nNouveau-né : 30 insufflations/min"},{"c":"05PR04","h":"Arrêt cardiaque en équipe","x":"si un pouls est perçu (hors compressions) et que la ventilation est absente ou anormale (FR ≤ 6 mvts/min) :\ninterrompre les compressions thoraciques ;\npoursuivre les insufflations à la fréquence de :\nAdulte / Enfant : 10 insufflations/min\nNourrisson : 20 insufflations/min\nNouveau-né : 30 insufflations/min"},{"c":"08PR02","h":"Noyade","x":"Spécificités liées à la prise en charge d’une victime de noyade\nsi le secouriste est isolé, il doit réaliser cinq cycles de réanimation cardio-pulmonaire avant de quitter la victime pour aller alerter les secours ;\ncompressions thoraciques :\nLes compressions thoraciques ne sont débutées que si la victime est hors de l’eau, sur terre ou dans une embarcation.\nPour réaliser les compressions thoraciques dans les embarcations, il est possible d’utiliser des dispositifs automatiques de massages cardiaques externes. Leur efficacité similaire aux compressions thoraciques manuelles en situation normale prend toute sa valeur dans un environnement difficile et étroit et pour des réanimations prolongées.\nadministration d’oxygène :\nL’administration d’oxygène sera rapide, systématique et à haute concentration (15 l/min) tant que la victime est en arrêt cardiaque et tant que l’on ne peut obtenir une SpO2 fiable."},{"c":"05PR04","h":"Arrêt cardiaque en équipe","x":"Lorsque la victime a perdu connaissance et ne respire pas, ou que la respiration est anormale, et que les secouristes sont en équipe avec matériel, il convient d’appliquer la conduite à tenir suivante :\nretirer délicatement tout corps étranger visible et facilement accessible dans la bouche ;\ndébuter immédiatement1 une RCP en répétant des cycles de :\nadulte : 30 compressions thoraciques / 2 insufflations ;\nenfant et nourrisson : 15 compressions thoraciques / 2 insufflations.\nle plus tôt possible, en interrompant le moins possible le massage cardiaque :\nmettre en œuvre le DAE et suivre ses indications vocales ;\nadministrer de l’oxygène2 par insufflation."},{"c":"05PR04","h":"Arrêt cardiaque en équipe","x":"En cas de contrôle du pouls1 à partir de 3 secouristes\nsi un pouls est perçu (hors compressions) et que la ventilation est absente ou anormale (FR ≤ 6 mvts/min)\ninterrompre les compressions thoraciques ;\npoursuivre les insufflations à la fréquence de :"},{"c":"05PR06","h":"Perte de connaissance en équipe","x":"A la suite d’un évènement non traumatique\nla placer en position stable sur le côté, en position latérale de sécurité (PLS1) à un secouriste ;"},{"c":"05PR06","h":"Perte de connaissance en équipe","x":"A la suite d’un traumatisme ou d’un événement d’origine inconnue\ndans l’attente d’un avis médical :\nlaisser la victime sur le dos dans l’attente d’un avis médical ;\npoursuivre la stabilisation de la tête de la victime à deux mains ;\nassurer une liberté des voies aériennes permanente ;\npoursuivre l’évaluation des fonctions vitales ;\ndemander un avis médical et appliquer leurs consignes ;\ninstaller la victime en PLS à deux secouristes2 seulement sur indication médicale ;\nsinon la laisser sur le dos."},null,{"c":"04PR04","h":"Quatrième regard","x":"La recherche des antécédents termine cet interrogatoire. Elle a pour but de connaître l’état de santé préalable de la victime. Elle porte sur :\nles antécédents Médicaux (maladies chroniques : asthme, diabète, épilepsie, arthrose, insuffisance respiratoire chronique, hypertension artérielle, hypercholestérolémie, etc.) et chirurgicaux,\nles Hospitalisations,\nles Traitements en cours et ses modifications récentes,\nles Allergies,\nl’existence de Facteurs de risques (tabagisme, sédentarité, stress, le surpoids, etc.)."},{"c":"04PR04","h":"Quatrième regard","x":"Les plaintes (douleur, angoisse, fatigue, troubles digestifs, paralysie, trouble de la parole ou de la vue, vertiges, etc.) sont analysées en fonction du contexte :\nLe facteur déclencheur ou améliorant (Provoqué par) ;\nLa Qualité (comment la douleur ou la gêne est décrite par la victime) ;\nLa localisation s’il y a lieu (dans quelle Région du corps ?) ;\nLa Sévérité (comment la douleur ou la gêne est ressentie par la victime) ;\nLa Temporalité (Depuis combien de temps ? À quel moment de la journée ? Est-ce la première fois ?)"},{"c":"04FT16","h":"Mesure de la douleur","x":"Échelle verbale simple (EVS)\nL’EVS est une échelle virtuelle qui évalue l’intensité de la douleur en 5 points, de 0 à 4 et pour laquelle correspond à chaque valeur une réponse verbale apportée par la victime.\nIl faut demander à la victime de préciser le niveau de sa douleur à l’instant présent en lui donnant une note de 0 à 4 selon les indications ci-dessous :"},{"c":"04FT15","h":"Recherche de lésions","x":"MEMBRES\nObserver chaque membre et les comparer\nPalper (empaumer latéralement le\nmembre sans le mobiliser et appuyer délicatement à deux mains en allant de sa racine à son extrémité)\nRechercher les pouls périphériques\nDemander de bouger les doigts ou les orteils\nDemander à la victime si elle sent quand on la touche en plusieurs endroits des membres\nPlaies et brûlures\nGonflements\nDéformations\nDouleur provoquée\nÉtat de la circulation du membre (coloration, température de la peau, pouls périphériques1)\nAltération motrice ou sensitive"},{"c":"04FT07","h":"Évaluation de la fonction respiratoire","x":"Tableau 4 : Fréquence ventilatoire en fonction de l’âge (en mouvements par minute)\nAdulte : 12 à 20\nEnfant : 20 à 30\nNourrisson : 30 à 40\nNouveau-né : 40 à 60"},{"c":"04FT07","h":"Évaluation de la fonction respiratoire","x":"Tableau 4 : Fréquence ventilatoire en fonction de l’âge (en mouvements par minute)\nAdulte : 12 à 20\nEnfant : 20 à 30\nNourrisson : 30 à 40\nNouveau-né : 40 à 60"},{"c":"04FT07","h":"Évaluation de la fonction respiratoire","x":"Tableau 4 : Fréquence ventilatoire en fonction de l’âge (en mouvements par minute)\nAdulte : 12 à 20\nEnfant : 20 à 30\nNourrisson : 30 à 40\nNouveau-né : 40 à 60"},{"c":"04FT07","h":"Évaluation de la fonction respiratoire","x":"Tableau 4 : Fréquence ventilatoire en fonction de l’âge (en mouvements par minute)\nAdulte : 12 à 20\nEnfant : 20 à 30\nNourrisson : 30 à 40\nNouveau-né : 40 à 60"},{"c":"05AC07","h":"Détresse respiratoire","x":"parler. Elle présente :\nune ventilation rapide, voire superficielle. Il est difficile de voir facilement le ventre et la poitrine de la victime se soulever\nune contraction des muscles du haut du thorax et du cou (tirage) ;\nun battement des ailes du nez et un creusement au-dessus du sternum ou au niveau du creux de l’estomac à l’inspiration s’il s’agit d’un enfant ;\ndes sueurs en l’absence d’effort ou de fièvre, ce qui traduit un défaut d’épuration du dioxyde de carbone (CO2 ) contenu dans le sang ;\nune coloration bleutée (cyanose), surtout au niveau des doigts, du lobe des oreilles et des lèvres. Cette coloration traduit un manque d’oxygénation du sang."},{"c":"05AC07","h":"Détresse respiratoire","x":"Le secouriste peut entendre en écoutant la ventilation :\nun sifflement traduisant une gêne au passage de l’air dans des voies aériennes rétrécies ;\ndes gargouillements traduisant un encombrement des voies aériennes par des sécrétions ou des vomissures ;\ndes râles traduisant la présence de liquide dans les poumons."},{"c":"05AC07","h":"Détresse respiratoire","x":"Le secouriste constate que la victime fait des efforts pour respirer, se tient la poitrine et ne peut plus\n1 Mouvement opposé du thorax et de l’abdomen. Lorsque l’un se soulève à l’inspiration, l’autre s’abaisse.\nparler. Elle présente :"},{"c":"05FT01","h":"Administration d’oxygène par inhalation","x":"Tableau 12: Objectifs de saturation\nSpO2 de 94 à 98 % chez l’adulte, l’enfant et le nourrisson\nSpO2 de 89 à 94 % chez l’insuffisant respiratoire chronique"},{"c":"05FT01","h":"Administration d’oxygène par inhalation","x":"Tableau 12: Objectifs de saturation\nSpO2 de 94 à 98 % chez l’adulte, l’enfant et le nourrisson\nSpO2 de 89 à 94 % chez l’insuffisant respiratoire chronique"},null,{"c":"05FT01","h":"Administration d’oxygène par inhalation","x":"Tableau 11 : Débits d’oxygène en fonction du dispositif d’inhalation d’O²\nPlages de débit d’utilisation : MHC (adulte et enfant) 15 à 9 l/min · Masque simple (adulte et enfant) 9 à 6 l/min · Lunettes à O2 6 à 1 l/min\nDébit initial : MHC 15 l/min · Masque simple 9 l/min · Lunettes à O2 2 l/min ou 1 ou 2 l/min de plus que son débit habituel"},{"c":"05FT01","h":"Administration d’oxygène par inhalation","x":"Tableau 11 : Débits d’oxygène en fonction du dispositif d’inhalation d’O²\nPlages de débit d’utilisation : MHC (adulte et enfant) 15 à 9 l/min · Masque simple (adulte et enfant) 9 à 6 l/min · Lunettes à O2 6 à 1 l/min\nDébit initial : MHC 15 l/min · Masque simple 9 l/min · Lunettes à O2 2 l/min ou 1 ou 2 l/min de plus que son débit habituel"},{"c":"05FT01","h":"Administration d’oxygène par inhalation","x":"Tableau 11 : Débits d’oxygène en fonction du dispositif d’inhalation d’O²\nPlages de débit d’utilisation : MHC (adulte et enfant) 15 à 9 l/min · Masque simple (adulte et enfant) 9 à 6 l/min · Lunettes à O2 6 à 1 l/min\nDébit initial : MHC 15 l/min · Masque simple 9 l/min · Lunettes à O2 2 l/min ou 1 ou 2 l/min de plus que son débit habituel"},{"c":"05FT01","h":"Administration d’oxygène par inhalation","x":"Cas particuliers\nintoxication aux fumées d’incendie, intoxication au monoxyde de carbone, accident de décompression :\ninhalation d’O2 avec un MHC et à un débit de 15 l/min, quel que soit le niveau de SpO2.\nvictime en détresse, lorsque la mesure de la SpO2 est impossible (absence de pouls périphérique lors d’une détresse circulatoire ou en cas d’hypothermie) :\ninhalation d’O2 avec un MHC et à un débit de 15 l/min quels que soient les antécédents de la victime dans l’attente d’un avis médical."},{"c":"08PR09","h":"Intoxications","x":"La dépression respiratoire avec troubles de la conscience et myosis sont des signes caractéristiques de surdosage ou d’intoxication aux opiacés ou aux opioïdes. L’évolution peut se faire vers la perte de connaissance et la mort de la victime par anoxie.\nDevant une victime qui présente une intoxication aux opiacés avec dépression respiratoire (FR < 12 mvts/min) et/ou une perte de connaissance, il faut :\nadministrer de l’oxygène en inhalation ;\nretirer les patchs de médicaments éventuels ;\ndemander un avis médical ;\nsi de la naloxone administrable par pulvérisation intra-nasale est disponible, administrer une pulvérisation de naloxone (antagoniste) dans une narine chez toute victime âgée de 14 ans et plus1 (voir fiche administration de médicaments). Si l’état de la victime ne s’améliore pas ou en cas de réapparition des signes, renouveler cette administration au bout de 2 à 3 min."},{"c":"05FT01","h":"Administration d’oxygène par inhalation","x":"L’inhalation d’oxygène est nécessaire chez toute victime qui présente :\nune détresse respiratoire ou circulatoire ;\nune intoxication aux fumées d’incendie ou au monoxyde de carbone ;\nun accident lié à la plongée ;\nune mesure de la SpO2 qui indique une valeur < 94 % ;\nune mesure de la SpO2 qui indique une valeur < 89 % chez l’insuffisant respiratoire chronique avec ou sans oxygène à domicile ;\nune crise douloureuse chez une victime qui présente des antécédents de drépanocytose.\nSi les circonstances ne permettent pas de prendre la mesure de la SpO2 (extrémités froides, panne de l’appareil, etc.), l’inhalation d’oxygène est systématique si la victime présente une détresse vitale, dans l’attente d’un avis médical."},{"c":"05FT15","h":"Aspiration de mucosité","x":"Tableau 15 : diamètre des sondes d’aspiration (unité de charrière, 1 CH = 1/3 mm) et dépression d’aspiration (mmHg)\nAdulte : 18 à 26 · 350 à 500\nEnfant : 8 à 12 · 200 à 350\nNourrisson : 6 à 8 · 200 à 250\nNouveau-né : 4 (prématuré) à 6 · 120 à 150"},{"c":"05FT15","h":"Aspiration de mucosité","x":"Tableau 15 : diamètre des sondes d’aspiration (unité de charrière, 1 CH = 1/3 mm) et dépression d’aspiration (mmHg)\nAdulte : 18 à 26 · 350 à 500\nEnfant : 8 à 12 · 200 à 350\nNourrisson : 6 à 8 · 200 à 250\nNouveau-né : 4 (prématuré) à 6 · 120 à 150"},{"c":"05FT15","h":"Aspiration de mucosité","x":"Tableau 15 : diamètre des sondes d’aspiration (unité de charrière, 1 CH = 1/3 mm) et dépression d’aspiration (mmHg)\nAdulte : 18 à 26 · 350 à 500\nEnfant : 8 à 12 · 200 à 350\nNourrisson : 6 à 8 · 200 à 250\nNouveau-né : 4 (prématuré) à 6 · 120 à 150"},{"c":"06AC05","h":"Crise d’asthme","x":"Forme grave : on constate dès le 2ème regard que la victime est consciente mais très angoissée et agitée. Elle se plaint de respirer difficilement, refuse de s'allonger et ne peut pas parler. Un sifflement à l'expiration est audible. Ces signes traduisent une détresse respiratoire."},null,null,null,{"c":"06FT01","h":"Positions d’attente et de transport","x":"La position assise ou demi-assise ;\nC’est une position souvent confortable pour les victimes. Elle est particulièrement indiquée si la victime présente une détresse ou une gêne respiratoire pour lui permettre de mieux respirer."},{"c":"04FT09","h":"Évaluation de la fonction circulatoire","x":"Tableau 5 : Fréquence cardiaque en fonction de l’âge (en battements par minute)\nAdulte : 60 à 100\nEnfant : 70 à 140\nNourrisson : 100 à 160\nNouveau-né : 120 à 160"},{"c":"04FT09","h":"Évaluation de la fonction circulatoire","x":"Tableau 5 : Fréquence cardiaque en fonction de l’âge (en battements par minute)\nAdulte : 60 à 100\nEnfant : 70 à 140\nNourrisson : 100 à 160\nNouveau-né : 120 à 160"},{"c":"04FT09","h":"Évaluation de la fonction circulatoire","x":"Tableau 5 : Fréquence cardiaque en fonction de l’âge (en battements par minute)\nAdulte : 60 à 100\nEnfant : 70 à 140\nNourrisson : 100 à 160\nNouveau-né : 120 à 160"},{"c":"04FT09","h":"Évaluation de la fonction circulatoire","x":"Tableau 5 : Fréquence cardiaque en fonction de l’âge (en battements par minute)\nAdulte : 60 à 100\nEnfant : 70 à 140\nNourrisson : 100 à 160\nNouveau-né : 120 à 160"},{"c":"05AC08","h":"Détresse circulatoire","x":"4. La détresse circulatoire peut ne pas être évidente si elle est en cours de constitution. Elle doit être suspectée devant :\nl’apparition progressive d’un ou plusieurs signes détaillés ci-dessus,\nl’impossibilité pour la victime de rester assis ou debout (vertiges),\nune sensation de soif."},{"c":"05AC08","h":"Détresse circulatoire","x":"3. La mesure des paramètres physiologiques peut confirmer cette détresse :\nle temps de recoloration cutanée (TRC) est supérieur à 2 secondes ;\nla fréquence cardiaque est supérieure à 120 battements par minute (chez une personne au repos) ou inférieure à 40 battements par minute ;\nla pression artérielle systolique est inférieure à 90 mmHg ou diminuée de plus de 30% de la valeur de la PA habituelle si la victime est hypertendue."},{"c":"04FT10","h":"Mesure de la pression artérielle","x":"Les valeurs normales de pression artérielle chez l’adulte au repos et réveillé oscillent autour de 100 mmHg de PA systolique et 80 mmHg de PA diastolique."},{"c":"04FT09","h":"Évaluation de la fonction circulatoire","x":"La recoloration cutanée du lit de l’ongle est inférieure à deux secondes ;"},null,{"c":"06AC02","h":"Douleur thoracique (non traumatique)","x":"Au 4ème regard, l'analyse de la douleur peut elle aussi orienter vers une maladie. La douleur peut être « en étau » ou « en coup de poignard », comme une déchirure, un poids sur le thorax ou une brûlure ou augmenter avec les mouvements ventilatoires.\nIl appartient de préciser le siège de la douleur et son irradiation : douleur au centre de la poitrine ou latéralement ou dans le dos. Cette douleur peut s’étendre au cou, à la mâchoire, aux épaules, voire aux bras ou au creux de l'estomac. Sa sévérité est précisée grâce à l'échelle de douleur."},null,{"c":"06AC02","h":"Douleur thoracique (non traumatique)","x":"Certaines causes de douleurs thoraciques peuvent conduire à l’atteinte d’une fonction vitale :\nl’occlusion d’une artère coronaire conduit à un infarctus qui peut se compliquer d'un trouble du rythme cardiaque (fibrillation ventriculaire) et d'un arrêt cardiaque ;"},{"c":"06AC02","h":"Douleur thoracique (non traumatique)","x":"Certaines causes de douleurs thoraciques peuvent conduire à l’atteinte d’une fonction vitale :\nl’occlusion d’une artère coronaire conduit à un infarctus qui peut se compliquer d'un trouble du rythme cardiaque (fibrillation ventriculaire) et d'un arrêt cardiaque ;\nla fissuration de l'aorte peut entraîner une hémorragie interne ;\nl'occlusion d’une artère pulmonaire peut entraîner un arrêt cardiaque si elle est massive et touche un gros vaisseau ;"},{"c":"06AC02","h":"Douleur thoracique (non traumatique)","x":"Lors de l’interrogatoire de la victime et de son entourage, il est possible d’apprendre que celle-ci :\na déjà présenté un épisode similaire, a été hospitalisée ;\na déjà des antécédents cardio-vasculaires (angine de poitrine, infarctus) ou pulmonaires (embolie pulmonaire, phlébites) ;\nprésente des facteurs de risques spécifiques comme : tabagisme, tabagisme avec contraceptifs oraux, obésité, diabète, hypertension, hypercholestérolémie ;\na des antécédents similaires chez les membres de sa famille."},{"c":"06AC02","h":"Douleur thoracique (non traumatique)","x":"Certaines causes de douleurs thoraciques peuvent conduire à l’atteinte d’une fonction vitale :\nl’occlusion d’une artère coronaire conduit à un infarctus qui peut se compliquer d'un trouble du rythme cardiaque (fibrillation ventriculaire) et d'un arrêt cardiaque ;\nla fissuration de l'aorte peut entraîner une hémorragie interne ;"},null,{"c":"04FT12","h":"Évaluation de la fonction neurologique","x":"Apprécier la symétrie et la taille des pupilles\nÀ la lumière du jour ;\nSous une lumière de « faible intensité ».\nles pupilles sont d’un diamètre égal et se resserrent à la lumière."},{"c":"04FT12","h":"Évaluation de la fonction neurologique","x":"Évaluer l’orientation de la victime dans le temps et dans l’espace\n« Comment vous appelez-vous ? »\n« En quelle année sommes-nous ? Quel jour sommes-nous ? »\n« Où sommes-nous ? »"},{"c":"04FT12","h":"Évaluation de la fonction neurologique","x":"Tableau 7 : Score de Glasgow (3 à 15)\nY : ouverture des yeux (réponse oculaire) — 1 Aucune · 2 À la douleur · 3 À la demande · 4 Spontanée\nV : réponse verbale — 1 Aucune · 2 Sons incompréhensibles · 3 Paroles inappropriées · 4 Confuse · 5 Normale\nM : réponse motrice — 1 Aucune · 2 Extension anormale (extension, enroulement des membres) · 3 Flexion anormale (flexion des membres) · 4 Retrait à la douleur · 5 Localise la douleur · 6 Normale"},{"c":"04FT12","h":"Évaluation de la fonction neurologique","x":"Tableau 7 : Score de Glasgow (3 à 15)\nY : ouverture des yeux (réponse oculaire) — 1 Aucune · 2 À la douleur · 3 À la demande · 4 Spontanée\nV : réponse verbale — 1 Aucune · 2 Sons incompréhensibles · 3 Paroles inappropriées · 4 Confuse · 5 Normale\nM : réponse motrice — 1 Aucune · 2 Extension anormale (extension, enroulement des membres) · 3 Flexion anormale (flexion des membres) · 4 Retrait à la douleur · 5 Localise la douleur · 6 Normale"},{"c":"04FT12","h":"Évaluation de la fonction neurologique","x":"Tableau 7 : Score de Glasgow (3 à 15)\nY : ouverture des yeux (réponse oculaire) — 1 Aucune · 2 À la douleur · 3 À la demande · 4 Spontanée\nV : réponse verbale — 1 Aucune · 2 Sons incompréhensibles · 3 Paroles inappropriées · 4 Confuse · 5 Normale\nM : réponse motrice — 1 Aucune · 2 Extension anormale (extension, enroulement des membres) · 3 Flexion anormale (flexion des membres) · 4 Retrait à la douleur · 5 Localise la douleur · 6 Normale"},{"c":"04FT12","h":"Évaluation de la fonction neurologique","x":"Tableau 7 : Score de Glasgow (3 à 15)\nY : ouverture des yeux (réponse oculaire) — 1 Aucune · 2 À la douleur · 3 À la demande · 4 Spontanée\nV : réponse verbale — 1 Aucune · 2 Sons incompréhensibles · 3 Paroles inappropriées · 4 Confuse · 5 Normale\nM : réponse motrice — 1 Aucune · 2 Extension anormale (extension, enroulement des membres) · 3 Flexion anormale (flexion des membres) · 4 Retrait à la douleur · 5 Localise la douleur · 6 Normale"},{"c":"04FT12","h":"Évaluation de la fonction neurologique","x":"Tableau 7 : Score de Glasgow (3 à 15)\nY : ouverture des yeux (réponse oculaire) — 1 Aucune · 2 À la douleur · 3 À la demande · 4 Spontanée\nV : réponse verbale — 1 Aucune · 2 Sons incompréhensibles · 3 Paroles inappropriées · 4 Confuse · 5 Normale\nM : réponse motrice — 1 Aucune · 2 Extension anormale (extension, enroulement des membres) · 3 Flexion anormale (flexion des membres) · 4 Retrait à la douleur · 5 Localise la douleur · 6 Normale"},{"c":"04FT12","h":"Évaluation de la fonction neurologique","x":"Tableau 7 : Score de Glasgow (3 à 15)\nY : ouverture des yeux (réponse oculaire) — 1 Aucune · 2 À la douleur · 3 À la demande · 4 Spontanée\nV : réponse verbale — 1 Aucune · 2 Sons incompréhensibles · 3 Paroles inappropriées · 4 Confuse · 5 Normale\nM : réponse motrice — 1 Aucune · 2 Extension anormale (extension, enroulement des membres) · 3 Flexion anormale (flexion des membres) · 4 Retrait à la douleur · 5 Localise la douleur · 6 Normale"},null,{"c":"06AC03","h":"Accident vasculaire cérébral","x":"Au cours du 3ème ou 4ème regard, la victime consciente peut présenter un ou plusieurs des signes spécifiques suivants :\nune déformation de la bouche : la victime présente une asymétrie de la face qui est encore plus évidente si on lui demande de faire la grimace ;\nune faiblesse ou un engourdissement d’un ou des deux côtés du corps : lorsqu’on demande à la victime de lever et d'étendre les deux bras et les mains devant elle, l’un des bras et/ou la main (ou les deux) ne peuvent être levés ou ne peuvent rester en position et retombent plus ou moins vite ;\nune difficulté du langage ou de la compréhension : lorsqu’on demande à la victime de répéter une phrase, elle a des difficultés à parler ou à comprendre.\nCes trois signes doivent être systématiquement recherchés. Ils sont communément appelés FAST."},{"c":"07AC09","h":"Traumatisme du crâne","x":"Lors de la poursuite du bilan :\nLa victime peut se plaindre :\nde céphalées ou d’une douleur spontanée au niveau des os du crâne ;\nde nausées ou de vomissements.\nÀ l’examen, le secouriste peut trouver :\nune perte de la mémoire des faits souvent synonyme d’une perte de connaissance passagère immédiatement après l’accident, parfois relatée par les témoins ;\nun déficit moteur neurologique ;\nune plaie du cuir chevelu, un hématome ou une déformation ;\nun hématome « en lunettes » (autour des yeux) pouvant témoigner d’une fracture des os de la base du crâne ;\nune otorragie ou une épistaxis ;\nEn cas d’otorragie, la compression manuelle est inutile. Vérifier que l’écoulement sanguin vient bien de l’intérieur de l’oreille en la nettoyant avec une compresse ;\ndes lésions associées en particulier de la colonne cervicale."},null,{"c":"06AC04","h":"Crise convulsive généralisée","x":"Lorsqu’elle survient, la crise convulsive généralisée est facilement identifiable au cours du 2ème regard. Elle se caractérise :\ndans un premier temps, par la survenue d’une perte brutale de connaissance avec chute de la victime ;\nensuite, par une raideur de la victime et des secousses musculaires involontaires, rythmées, touchant un ou plusieurs membres, accompagnées d’une révulsion des globes oculaires, d’une respiration irrégulière ou absente, d’une hypersalivation et d’une contracture des muscles de la mâchoire ;\nCette phase dure en règle générale moins de cinq minutes, période pendant laquelle la victime peut se mordre la langue.\nenfin, après les secousses, la victime reste sans connaissance plusieurs minutes. Sa respiration peut être bruyante. Elle peut aussi perdre ses urines, plus rarement ses selles."},{"c":"06AC04","h":"Crise convulsive généralisée","x":"enfin, après les secousses, la victime reste sans connaissance plusieurs minutes. Sa respiration peut être bruyante. Elle peut aussi perdre ses urines, plus rarement ses selles.\nLors de la reprise progressive de sa conscience, la victime peut être hébétée, le regard fixe ou se comporter de manière étrange et ne se souvient de rien (amnésie des circonstances)."},{"c":"06AC04","h":"Crise convulsive généralisée","x":"Dans certains cas, elle peut enchaîner plusieurs crises convulsives avec ou sans reprise de conscience entre les crises. C’est l’état de mal convulsif qui nécessite une prise en charge médicale urgente."},{"c":"06AC06","h":"Malaise hypoglycémique chez le diabétique","x":"Lors du transfert de la valeur de la mesure, il est essentiel d’indiquer l’unité de mesure de la glycémie utilisée par l’appareil : millimoles par litre (mmol/l), milligrammes par décilitre (mg/dl) ou grammes par litre (g/l). En fonction de l’unité, le chiffre est totalement différent.\nOn considère qu’une victime est en hypoglycémie si la valeur mesurée de la glycémie est < 3,3 mmol/l (ou < 60 mg/dl ou < 0,6 g/l)."},null,{"c":"06PR06","h":"Malaise hypoglycémique chez le diabétique","x":"Si la victime est réveillée, réactive, et capable d’avaler, et que :\nla mesure de la glycémie est < 3,3 mmol/l (ou < 60 mg/dl ou < 0,6 g/l) ;\nou l’origine du malaise est inconnue :\naider la victime à prendre :\nde préférence du sucre en morceaux ou en poudre\nadulte : 4 morceaux ou cuillères à café de sucre ;\nenfants : 2 à 3 morceaux ou cuillères à café de sucre ;\nsinon :\nune boisson sucrée comme un jus d’orange ou du miel,\ndes bonbons contenant du sucrose."},{"c":"06PR06","h":"Malaise hypoglycémique chez le diabétique","x":"surveiller1 la victime :\nsi aucune amélioration ne survient au bout de 15 minutes suite à une ingestion de sucre, une seconde dose de sucre peut être prise.\n1 Il faut compter environ 10 à 15 minutes entre l’ingestion du sucre, une élévation de la glycémie et une amélioration des signes."},{"c":"08AC06","h":"Hypothermie","x":"On classe généralement les hypothermies en fonction de leur température et des signes qui y sont associés :\nLégère — 35 à 32 °C : La victime est consciente, sa ventilation et la fréquence cardiaque sont rapides. Elle présente des frissons permanents et sa peau est froide ;\nModérée — 32 à 28 °C : La victime délire, présente des hallucinations et des troubles de la conscience d’aggravation progressive. Sa ventilation et la fréquence cardiaque se ralentissent. Il n’y a plus de frissons, mais une rigidité musculaire modérée ;\nSévère — 28 à 24 °C : La victime a perdu connaissance, le pouls est difficile à percevoir et la fréquence cardiaque ainsi que la ventilation sont lentes.\nGrave — < 24 °C : La victime est en arrêt cardiaque apparent."},{"c":"08AC06","h":"Hypothermie","x":"On classe généralement les hypothermies en fonction de leur température et des signes qui y sont associés :\nLégère — 35 à 32 °C : La victime est consciente, sa ventilation et la fréquence cardiaque sont rapides. Elle présente des frissons permanents et sa peau est froide ;\nModérée — 32 à 28 °C : La victime délire, présente des hallucinations et des troubles de la conscience d’aggravation progressive. Sa ventilation et la fréquence cardiaque se ralentissent. Il n’y a plus de frissons, mais une rigidité musculaire modérée ;\nSévère — 28 à 24 °C : La victime a perdu connaissance, le pouls est difficile à percevoir et la fréquence cardiaque ainsi que la ventilation sont lentes.\nGrave — < 24 °C : La victime est en arrêt cardiaque apparent."},{"c":"08PR07","h":"Hypothermie","x":"La victime présente une détresse vitale\nla victime ne présente pas de signes de vie. Elle est inconsciente et ne respire plus ou présente un état de mort apparente :\nappliquer la conduite à tenir devant une victime en arrêt cardiaque. Précautions particulières pour la RCP d’une victime hypotherme :\nrechercher la présence de signes de vie au moins pendant 1 minute,\nLa recherche de la ventilation ou du pouls d’une victime hypotherme est très difficile. En cas de doute, débuter la RCP."},{"c":"08PR07","h":"Hypothermie","x":"dès que la RCP est en cours, confirmer l’hypothermie en mesurant la température de la victime avec un thermomètre hypotherme s’il est disponible,\nun cœur hypotherme peut ne pas réagir à une défibrillation,\nLe nombre de défibrillations successives chez une victime qui présente une température < 30 °C doit être limité à 3 tant que la victime n’est pas réchauffée."},{"c":"08AC05","h":"Affections liées à la chaleur","x":"Les affections liées à la chaleur sont des élévations anormales, au-dessus de 37,5 °C, de la température corporelle, plus ou moins accompagnées de différents symptômes non spécifiques.\nLa forme d'évolution la plus grave, qui engage le pronostic vital, est le coup de chaleur (ou hyperthermie maligne d’effort), qui associe une température corporelle supérieure à 40 °C et des troubles neurologiques et qui évolue vers une détresse vitale avec notamment des troubles circulatoires."},{"c":"07FT08","h":"Immobilisation d’un membre au moyen d’une attelle à dépression","x":"La mise en place est réalisée par trois secouristes au minimum :"},{"c":"07FT10","h":"Immobilisation d’un membre inférieur au moyen d’une attelle à traction","x":"L’attelle à traction ne peut être mise en place qu’à la demande et en présence d’un médecin."},{"c":"07FT06","h":"Immobilisation d’un membre supérieur au moyen d’écharpes","x":"Traumatisme de la main, du poignet et de l’avant-bras\nL’immobilisation est réalisée par une écharpe simple. Pour cela :"},{"c":"07FT06","h":"Immobilisation d’un membre supérieur au moyen d’écharpes","x":"Traumatisme de l’épaule (clavicule, omoplate)\nL’immobilisation est réalisée par une écharpe oblique. Pour cela :"},{"c":"07FT06","h":"Immobilisation d’un membre supérieur au moyen d’écharpes","x":"Traumatisme du bras\nL’immobilisation est réalisée par une écharpe simple et une contre-écharpe. Pour cela :"},{"c":"07FT16","h":"Contention pelvienne","x":"Indication\nUne contention pelvienne est mise en place chez une victime suspecte d'un traumatisme du bassin avant son transport :\naprès avis ou à la demande du médecin ;\nsi la victime présente des signes de détresse circulatoire (hémorragie interne) et qu’un avis médical ne peut pas être obtenu.\nUne contention pelvienne peut être préinstallée sous la victime dans l'attente d'un avis médical."},{"c":"04FT15","h":"Recherche de lésions","x":"Ne pas palper : la palpation du bassin peut entraîner un déplacement d’éventuelles fractures et aggraver un saignement interne."},{"c":"07PR08","h":"Traumatisme du dos et du cou","x":"(A) Victime dont les réponses sont qualifiées de NON fiables\nFiabilité des réponses (A) de la victime ?\nOUI\nPrésence d’une détresse vitale.\nAltération du niveau de conscience.\nNON\nNon, coopération, difficultés de communication.\nInfluence de l’alcool ou d’autres drogues.\nPrésence d’une atteinte traumatique sévère (douleur distrayante)."},{"c":"07PR08","h":"Traumatisme du dos et du cou","x":"la victime ne peut pas être examinée complètement ou l’examen n’est pas fiable (A) : la victime présente une altération du niveau de conscience ou est confuse, est sous l’influence de l’alcool ou d’autres drogues, présente de nombreuses lésions qui empêchent de rechercher des signes d’atteinte du rachis, a des difficultés de communication (langue étrangère, enfant),\nla victime se plaint ou présente des signes d’une atteinte du rachis (B) ou de la moelle(C) comme une douleur de la colonne vertébrale, un déficit moteur ou sensitif des membres, une sensation anormale des membres (décharges électriques, fourmillements), un priapisme, une déformation de la colonne vertébrale, une sensibilité de la colonne vertébrale (douleur provoquée à la palpation), une douleur de la colonne vertébrale quand la victime tousse, essaye de se déplacer ou de s’asseoir1,\nla victime présente un traumatisme à haut risque (D) de lésion du rachis et :\nsoit a plus de 65 ans,\nsoit présente des antécédents à risque(E) comme une chirurgie ou une fracture antérieure de la colonne vertébrale ou une maladie osseuse ou du rachis (ostéoporose)."},{"c":"07PR08","h":"Traumatisme du dos et du cou","x":"Chute sur la tête d’une hauteur > 1 mètre comme lors d’un plongeon (rachis cervical) ou chute sur les pieds ou\nPas"},{"c":"07PR08","h":"Traumatisme du dos et du cou","x":"la victime présente un traumatisme à haut risque (D) de lésion du rachis et :\nsoit a plus de 65 ans,\nsoit présente des antécédents à risque(E) comme une chirurgie ou une fracture antérieure de la colonne vertébrale ou une maladie osseuse ou du rachis (ostéoporose)."},{"c":"07PR08","h":"Traumatisme du dos et du cou","x":"Choix de la technique de relevage\nrelevage d’une victime allongée sur le sol\nPour relever une victime allongée au sol, il est préférable d’utiliser un brancard cuillère plutôt qu’un plan dur.\nUne fois installés sur le brancard cuillère, les blocs de tête peuvent être utilisés pour restreindre les mouvements du rachis cervical. Ils permettent ainsi de libérer le secouriste chargé du maintien de la tête lors du transfert de la victime dans un moyen d’immobilisation.\nEn l’absence de brancard cuillère, relever la victime en utilisant une technique de relevage en pont à plusieurs secouristes."},{"c":"07PR08","h":"Traumatisme du dos et du cou","x":"victime située dans un endroit difficile d’accès (endroit exigu, véhicule accidenté…)\nSi la victime nécessite une immobilisation corps entier, réaliser une technique d’extraction en utilisant les moyens dédiés comme le plan dur ou l’attelle cervico-thoracique.\nSi la stabilisation de la tête par un sauveteur est difficile lors de la manœuvre d’extraction, il est nécessaire de restreindre les mouvements du rachis avec un collier cervical rigide puis l’attelle cervico-thoracique."},{"c":"07PR08","h":"Traumatisme du dos et du cou","x":"immobilisation de la colonne vertébrale\nL’immobilisation corps entier d’une victime qui présente un traumatisme du rachis est réalisée :\nen priorité dans un matelas immobilisateur à dépression qui doit rester en place pour le transfert sur le brancard à l’hôpital. Les blocs de tête peuvent être utilisés pour restreindre les mouvements du rachis cervical à l’intérieur du matelas ;\nUne fois immobilisée, si la victime porte un collier cervical rigide, il faut le desserrer.\nLe MID permet aussi d’immobiliser les victimes dans la position adaptée à leur détresse (demi-assise pour une détresse respiratoire).\nexceptionnellement sur un plan dur équipé de blocs de tête :\nen cas d’indisponibilité d’un MID,\nsi le nombre de secouristes n’est pas suffisant pour transférer la victime du plan dur sur le MID,\nen l’absence de contre-indications comme :\nune déformation préexistante de la colonne vertébrale,\nou s’il faut immobiliser la victime dans une autre position (détresse respiratoire)."},{"c":"07PR08","h":"Traumatisme du dos et du cou","x":"Le collier cervical doit être :\nadapté à la taille de la victime,\npositionné correctement,\ndesserré une fois l’immobilisation sur le MID réalisée,\nresserré pour une nouvelle mobilisation (transfert sur un brancard)."},{"c":"07PR02","h":"Plaie","x":"En présence d’une plaie grave\nne jamais retirer le corps étranger pénétrant (couteau, morceau de verre, etc.)1;\ninstaller la victime en position d'attente, confortablement2 et sans délai :\nassise3 en laissant la plaie à l’air libre en présence d'une plaie au thorax ;\nallongée4, jambes fléchies5 en présence d'une plaie de l'abdomen ;\nallongée, yeux fermés6 en demandant de ne pas bouger la tête en présence d'une plaie à l'œil ;\nallongée7 dans tous les autres cas."},{"c":"07PR02","h":"Plaie","x":"à l’exception des plaies du thorax, protéger la plaie par un pansement ou un champ stérile humidifié8 ;"},{"c":"07PR02","h":"Plaie","x":"demander à la victime de mordre la compresse humide."},{"c":"07PR02","h":"Plaie","x":"à défaut, la conserver dans un petit récipient contenant4 du lait de vache ou de la salive de la victime"},{"c":"07AC01","h":"Brûlures","x":"L’aspect des brûlures diffère en fonction de la profondeur de celle-ci :\nune peau rouge, sèche et douloureuse traduit une atteinte superficielle ;\ndes cloques ou phlyctènes, uniques ou multiples et plus ou moins étendues, accompagnées d’une douleur forte ou modérée, traduit une atteinte plus profonde ;"},{"c":"07AC01","h":"Brûlures","x":"une pâleur cireuse, un aspect noirâtre ou brunâtre de la peau traduit une atteinte très profonde de toutes les couches de la peau.\nCes brûlures sont souvent peu douloureuses, car les terminaisons nerveuses ont été détruites."},{"c":"07AC01","h":"Brûlures","x":"La brûlure est une lésion de la peau, des voies aériennes ou digestives. Elle est qualifiée de :\nbrûlure simple, lorsqu’il s’agit de rougeurs de la peau chez l’adulte ou d’une cloque dont la surface est inférieure à celle de la moitié de la paume de la main de la victime ;\nbrûlure grave, dès lors que l’on est en présence :\nd’une ou plusieurs cloques dont la surface totale est supérieure à celle de la moitié de la paume de la main de la victime ;"},{"c":"07PR01","h":"Brûlures","x":"En présence d’une brûlure thermique\nrefroidir2 immédiatement la surface brûlée tout en retirant les vêtements3, et les bijoux4 :\nsi la brûlure s’est produite il y a moins de 30 minutes ;\net si la victime est consciente ;\net n’a pas de détresse circulatoire ;\net si la surface brûlée est inférieure à : 20% chez un adulte, 10% chez un enfant ou un nourrisson."},{"c":"07PR01","h":"Brûlures","x":"2 Avec de l'eau courante tempérée et à faible pression. Pendant au moins 10 minutes, idéalement 20 minutes. Débuter l’arrosage après 30 minutes n’a pas d’intérêt."},{"c":"07PR01","h":"Brûlures","x":"Si la brûlure est simple\npoursuivre le refroidissement jusqu'à disparition de la douleur ;\nne jamais percer les cloques ;"},{"c":"07PR01","h":"Brûlures","x":"Si la brûlure est simple\npoursuivre le refroidissement jusqu'à disparition de la douleur ;\nne jamais percer les cloques ;\nprotéger la brûlure par un pansement stérile ou un film plastique non adhésif1 ;\nconseiller à la victime de consulter un médecin :\nsi elle n’est pas à jour de sa vaccination antitétanique ;\ns'il s'agit d'un enfant ou d'un nourrisson ;\nsi des signes d’une infection2 apparaissent dans les jours qui suivent."},null,null,{"c":"08AC04","h":"Accouchement inopiné","x":"Normalement, l’accouchement survient lors du 9ème mois de grossesse, soit entre 37 et 41 semaines révolues d’aménorrhée (absence de règles). Avant 37 semaines d’aménorrhée, on parle d’accouchement prématuré."},null,{"c":"05AC03","h":"Hémorragies extériorisées","x":"Dans les autres cas, il s’agit d’une perte de sang inhabituelle, émanant des voies :\nurinaires : émission de sang ou d’urine teintée de sang ;\nanale : sang dans les selles ou saignement isolé ;\nvaginale : règles anormalement abondantes ou saignement inattendu."},null,null,{"c":"08PR04","h":"Accouchement inopiné","x":"réaliser un bilan de la femme enceinte, et au cours du 4ème regard, recueillir2 les éléments suivants :\nla date et le lieu prévus de l’accouchement ;\nles contractions : heure du début (douleurs régulières), durée et intervalle entre deux ;\nla perte des eaux : heure de la perte et couleur du liquide (transparent, trouble, sanglant) ;\nsi la parturiente a perdu du sang ;\nsi la parturiente sent le bébé bouger ;\nle suivi ou non de la grossesse ;\nles problèmes liés à cette grossesse (malformation fœtale, diabète, hypertension, œdèmes, etc.) ;\ns’il s’agit d’une grossesse simple ou multiple et son déroulement ;\nle type d’accouchement prévu (voie basse ou césarienne) et nature de la présentation (tête, siège, épaule),\nle nombre d’accouchements déjà réalisé et leur déroulement."},{"c":"08PR04","h":"Accouchement inopiné","x":"recommencer la même manœuvre jusqu’à l’apparition de la moitié de la tête du nouveau-né ;"},{"c":"08FT01","h":"Soin au cordon ombilical","x":"Indication\nLe clampage et la section du cordon ombilical doivent être réalisés :\naprès la naissance, après la 1ère minute de vie ;\nparfois pendant l’accouchement, en cas de circulaire serré du cordon (cordon entourant le cou du bébé)."},{"c":"05FT15","h":"Aspiration de mucosité","x":"Cas particulier : aspiration du nouveau-né à la naissance\nSi une aspiration du nouveau-né est nécessaire :\nutiliser une sonde de petit calibre et une dépression adaptée (cf. tableau précédent) ;\ndébuter toujours par une aspiration de la bouche sans enfoncer la sonde de plus de 5 cm ;\npuis aspirer chaque narine, l’une après l’autre, perpendiculairement au visage, sans enfoncer la sonde de plus de 1cm de profondeur.\nLe nouveau-né a une respiration qui est nasale. L’aspiration des narines avant la bouche pourrait entraîner une inhalation des sécrétions contenues dans la bouche."},{"c":"08PR05","h":"Prise en charge du nouveau-né à la naissance","x":"placer le nouveau-né sur une surface plane recouverte d’un linge propre (pour l’isoler du froid), après avoir clampé le cordon ombilical ;\nlibérer ses voies aériennes en plaçant sa tête en position neutre et si nécessaire en aspirant prudemment sa bouche puis ses narines ;\nsi son état est inchangé, réaliser 40 insufflations à l’air en 1 minute ;\nSi le thorax ne se soulève pas après les 5 premières insufflations, vérifier la liberté des voies aériennes et l’étanchéité du masque."},{"c":"08PR05","h":"Prise en charge du nouveau-né à la naissance","x":"Fréquence Cardiaque\nProcédure\n< 60 battements par minute\nRéaliser une RCP avec un apport complémentaire d'oxygène et sans pose du DAE.\nLe rythme de la RCP est de 3 compressions à une fréquence instantanée de 120 par minute pour 1 insufflation."},null,null,{"c":"04FT07","h":"Évaluation de la fonction respiratoire","x":"Pour évaluer la présence de la respiration chez une victime qui a perdu connaissance, il convient de :\nassurer la liberté des voies aériennes ;\nse pencher sur la victime, l’oreille et la joue du secouriste au-dessus de sa bouche et de son nez ;\nrechercher, durant dix secondes au plus :\navec la joue : le flux d’air expiré par le nez et la bouche,\navec l’oreille : les bruits normaux (souffle) ou anormaux de la respiration (sifflement, ronflement, gargouillement),\navec les yeux : le soulèvement du ventre ou de la poitrine."},null,null,null,null,null,null,null,null,{"c":"05FT16","h":"Utilisation d’un défibrillateur automatisé externe","x":"les défibrillateurs semi-automatiques."},null,{"c":"06PR07","h":"Réaction allergique grave","x":"En l’absence d’amélioration ou en cas de récidive dans les 5 minutes qui suivent la première injection, une deuxième injection à l’aide de l’auto-injecteur peut être réalisée. Si possible, demander un nouvel avis au médecin régulateur."},null,{"c":"04FT07","h":"Évaluation de la fonction respiratoire","x":"Apprécier la respiration\nPour apprécier la respiration d’une victime, il convient de :\nécouter les dires de la victime si elle peut s’exprimer.\nécouter la facilité avec laquelle la victime parle ou respire.\nobserver la respiration pendant 15 secondes environ : sa rapidité, son amplitude, sa régularité :\nen regardant la partie supérieure de l’abdomen et du thorax,\nen plaçant une main à cheval sur la partie inférieure de son sternum et le haut de l’abdomen,\napprécier la coloration :\nde la peau au niveau de la face et des extrémités,\ndes muqueuses au niveau des lèvres"},{"c":"04FT07","h":"Évaluation de la fonction respiratoire","x":"Apprécier la respiration\nPour apprécier la respiration d’une victime, il convient de :\nécouter les dires de la victime si elle peut s’exprimer.\nécouter la facilité avec laquelle la victime parle ou respire.\nobserver la respiration pendant 15 secondes environ : sa rapidité, son amplitude, sa régularité :\nen regardant la partie supérieure de l’abdomen et du thorax,\nen plaçant une main à cheval sur la partie inférieure de son sternum et le haut de l’abdomen,\napprécier la coloration :\nde la peau au niveau de la face et des extrémités,\ndes muqueuses au niveau des lèvres"},null,null,{"c":"05FT01","h":"Administration d’oxygène par inhalation","x":"L’administration d’oxygène à l’aide de lunettes sans humidification peut entraîner une irritation nasale pour des débits > 4 l/min."},null,{"c":"05FT01","h":"Administration d’oxygène par inhalation","x":"Tableau 11 : Débits d’oxygène en fonction du dispositif d’inhalation d’O²\nPlages de débit d’utilisation : MHC (adulte et enfant) 15 à 9 l/min · Masque simple (adulte et enfant) 9 à 6 l/min · Lunettes à O2 6 à 1 l/min\nDébit initial : MHC 15 l/min · Masque simple 9 l/min · Lunettes à O2 2 l/min ou 1 ou 2 l/min de plus que son débit habituel"},{"c":"05FT01","h":"Administration d’oxygène par inhalation","x":"Tableau 11 : Débits d’oxygène en fonction du dispositif d’inhalation d’O²\nPlages de débit d’utilisation : MHC (adulte et enfant) 15 à 9 l/min · Masque simple (adulte et enfant) 9 à 6 l/min · Lunettes à O2 6 à 1 l/min\nDébit initial : MHC 15 l/min · Masque simple 9 l/min · Lunettes à O2 2 l/min ou 1 ou 2 l/min de plus que son débit habituel"},null,null,{"c":"04FT09","h":"Évaluation de la fonction circulatoire","x":"Mesurer le temps de recoloration cutanée (TRC).\nS’assurer de l’absence de vernis empêchant l’observation du lit de l’ongle.\nComprimer fortement pendant 3 secondes, entre le pouce et l’index, l’extrémité d’un doigt, le lit de l’ongle devenu pâle.\nRelâcher la pression.\nMesurer le temps (en seconde) de recoloration."},{"c":"04FT09","h":"Évaluation de la fonction circulatoire","x":"régulier, symétrique et ne marque pas de pause."},null,{"c":"04FT09","h":"Évaluation de la fonction circulatoire","x":"La recoloration cutanée du lit de l’ongle est inférieure à deux secondes ;\nLa pression artérielle chez l’adulte au repos et réveillé oscille autour de 100 mmHg de PA systolique et 80 mmHg de PA diastolique."},{"c":"07AC04","h":"Traumatisme de l’abdomen","x":"des vomissements de sang rouge (hématémèse)."},{"c":"05AC03","h":"Hémorragies extériorisées","x":"Dans les autres cas, il s’agit d’une perte de sang inhabituelle, émanant des voies :\nurinaires : émission de sang ou d’urine teintée de sang ;\nanale : sang dans les selles ou saignement isolé ;\nvaginale : règles anormalement abondantes ou saignement inattendu."},{"c":"05AC03","h":"Hémorragies extériorisées","x":"Dans les autres cas, il s’agit d’une perte de sang inhabituelle, émanant des voies :\nurinaires : émission de sang ou d’urine teintée de sang ;\nanale : sang dans les selles ou saignement isolé ;\nvaginale : règles anormalement abondantes ou saignement inattendu."},{"c":"07AC09","h":"Traumatisme du crâne","x":"une otorragie ou une épistaxis ;\nEn cas d’otorragie, la compression manuelle est inutile. Vérifier que l’écoulement sanguin vient bien de l’intérieur de l’oreille en la nettoyant avec une compresse ;"},null,{"c":"05FT05","h":"Gaze imbibée de substance hémostatique","x":"Une fois le saignement arrêté :\nréaliser la pose d’un pansement compressif pour maintenir en place la gaze imbibée de substance hémostatique et maintenir la pression.\nnoter : le nombre de gazes hémostatiques utilisés et l’heure de la pose et leurs localisations."},{"c":"04FT12","h":"Évaluation de la fonction neurologique","x":"L’évaluation de fonction neurologique se fait en trois temps :\nRechercher une perte de connaissance (2ème regard)\nApprécier la fonction neurologique. Elle se fait en posant des questions, en stimulant la victime et éventuellement en lui demandant de réaliser certains gestes (3ème regard).\nMesurer la fonction neurologique en évaluant la réponse de la victime à certaines sollicitations ou tests (4ème regard) :\nScore EVDA (AVPU en anglo-saxon)\nScore de Glasgow\nScores de l’AVC"},{"c":"04FT12","h":"Évaluation de la fonction neurologique","x":"Rechercher une perte de connaissance initiale ou passagère\nInterroger l’entourage de la victime\nDemander à la victime si elle se souvient de ce qui s’est passé."},{"c":"04FT12","h":"Évaluation de la fonction neurologique","x":"Apprécier la symétrie et la taille des pupilles\nÀ la lumière du jour ;\nSous une lumière de « faible intensité ».\nles pupilles sont d’un diamètre égal et se resserrent à la lumière."},{"c":"04FT12","h":"Évaluation de la fonction neurologique","x":"Apprécier la symétrie et la taille des pupilles\nÀ la lumière du jour ;\nSous une lumière de « faible intensité ».\nles pupilles sont d’un diamètre égal et se resserrent à la lumière."},null,{"c":"06AC03","h":"Accident vasculaire cérébral","x":"Au cours du 3ème ou 4ème regard, la victime consciente peut présenter un ou plusieurs des signes spécifiques suivants :\nune déformation de la bouche : la victime présente une asymétrie de la face qui est encore plus évidente si on lui demande de faire la grimace ;\nune faiblesse ou un engourdissement d’un ou des deux côtés du corps : lorsqu’on demande à la victime de lever et d'étendre les deux bras et les mains devant elle, l’un des bras et/ou la main (ou les deux) ne peuvent être levés ou ne peuvent rester en position et retombent plus ou moins vite ;\nune difficulté du langage ou de la compréhensio
