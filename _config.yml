title: OSR & Nico
description: Règles et autres pour jouer à OSR avec Nico
theme: just-the-docs
# Color scheme supports "light" (default) and "dark"
color_scheme: dark

url: "https://drloser123.github.io"
baseurl: "/osr"

# Pages autonomes servies à la racine du domaine (copiées par le workflow), pas dans /osr/
exclude:
  - trivial-pse/
  - 5e-regard/
  - referentiel-pse/
  - site-root/
  - Gemfile
  - Gemfile.lock
  - vendor/

aux_links:
